<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>spekco | Profile</title>

    <style>
        /* =========================================================
           1. VARIABLES
        ========================================================= */

        :root {
            --bg: #0f051d;
            --card: rgba(20, 10, 35, 0.48);

            --text: #ffffff;
            --muted: #cfc5da;

            --pink: #ff8fd2;
            --pink-light: #ffe5f3;
            --purple: #a66cff;

            --online: #6cff3d;
            --offline: #888888;

            --border: rgba(255, 255, 255, 0.18);
            --glass: rgba(255, 255, 255, 0.08);

            --radius: 22px;
            --gap: 14px;
        }


        /* =========================================================
           2. RESET
        ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            width: 100%;

            overflow-x: hidden;

            color: var(--text);
            background: var(--bg);

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                sans-serif;
        }

        button,
        input {
            font: inherit;
        }


        /* =========================================================
           3. LAYOUT
        ========================================================= */

        .container {
            width: calc(100% - 24px);
            max-width: 390px;

            margin: 20px auto;

            display: flex;
            flex-direction: column;
            gap: var(--gap);
        }

        .card {
            padding: 18px;

            border-radius: var(--radius);

            background: var(--card);

            border: 1px solid var(--border);

            box-shadow:
                0 8px 35px rgba(0, 0, 0, 0.35),
                inset 0 0 20px rgba(255, 255, 255, 0.03);

            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }


        /* =========================================================
           4. PROFILE
        ========================================================= */

        .profile-card {
            padding-top: 22px;
            text-align: center;
        }

        .speech-bubble {
            display: inline-block;

            padding: 8px 12px;
            margin-bottom: 15px;

            border-radius: 14px;

            background: rgba(255, 150, 210, 0.18);
            border: 1px solid rgba(255, 180, 220, 0.35);

            color: var(--pink-light);

            font-size: 12px;
        }

        .avatar-wrapper {
            width: 92px;
            height: 92px;

            margin: 0 auto 12px;
            padding: 3px;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #ff9edc,
                    var(--purple),
                    #ff9edc
                );

            box-shadow:
                0 0 25px rgba(220, 100, 255, 0.65);
        }

        .avatar {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;

            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.8);

            background: #1a0d2a;
        }

        .username {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1px;
        }


        /* =========================================================
           5. ONLINE STATUS
        ========================================================= */

        .status-badge {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 7px;

            margin-top: 6px;

            color: #9cff68;
            font-size: 13px;

            transition: color 0.3s ease;
        }

        .status-dot {
            width: 9px;
            height: 9px;

            border-radius: 50%;

            background: var(--online);

            box-shadow: 0 0 10px var(--online);

            animation: pulse 1.5s infinite;
        }

        .status-badge.offline-text {
            color: #aaaaaa;
        }

        .status-dot.offline {
            background: var(--offline);
            box-shadow: none;
            animation: none;
        }

        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.35);
                opacity: 0.6;
            }
        }


        /* =========================================================
           6. STATUS CARD
        ========================================================= */

        .status-card {
            text-align: center;

            color: #e9dff5;

            font-size: 14px;
            font-style: italic;
        }


        /* =========================================================
           7. MUSIC PLAYER
        ========================================================= */

        .music-card {
            text-align: center;
        }

        .music-label {
            margin-bottom: 8px;

            color: #ff9bd8;

            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .clock {
            margin-bottom: 8px;

            color: var(--pink);

            font-size: 25px;
            font-weight: 700;
        }

        .song-title {
            margin-bottom: 14px;

            overflow: hidden;

            white-space: nowrap;
            text-overflow: ellipsis;

            font-size: 14px;
        }


        /* Progress */

        .progress-container {
            width: 100%;
            margin-bottom: 5px;
        }

        #progress {
            width: 100%;
            height: 5px;

            appearance: none;
            -webkit-appearance: none;

            border: 0;
            border-radius: 10px;

            background: rgba(255, 255, 255, 0.2);

            outline: none;

            cursor: pointer;
        }

        #progress::-webkit-slider-thumb {
            width: 14px;
            height: 14px;

            appearance: none;
            -webkit-appearance: none;

            border-radius: 50%;
            border: 0;

            background: var(--pink);

            box-shadow:
                0 0 10px rgba(255, 100, 210, 0.8);

            cursor: pointer;
        }

        #progress::-moz-range-thumb {
            width: 14px;
            height: 14px;

            border: 0;
            border-radius: 50%;

            background: var(--pink);

            box-shadow:
                0 0 10px rgba(255, 100, 210, 0.8);

            cursor: pointer;
        }

        .time-row {
            display: flex;
            justify-content: space-between;

            margin-top: 5px;

            color: var(--muted);

            font-size: 10px;
        }


        /* Music buttons */

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;

            margin-top: 13px;
        }

        .music-button {
            width: 44px;
            height: 44px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;

            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);

            font-size: 17px;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                background 0.2s ease;
        }

        .music-button:hover {
            background: rgba(255, 255, 255, 0.16);
        }

        .music-button:active {
            transform: scale(0.88);
        }

        .play-button {
            width: 56px;
            height: 56px;

            font-size: 21px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255, 120, 200, 0.65),
                    rgba(150, 100, 255, 0.65)
                );

            box-shadow:
                0 0 20px rgba(220, 100, 255, 0.35);
        }


        /* =========================================================
           8. TECH STACK
        ========================================================= */

        .tech-stack {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;

            gap: 14px;
        }

        .tech-icon {
            width: 46px;
            height: 46px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 12px;

            background: var(--glass);

            border: 1px solid rgba(255, 255, 255, 0.12);

            transition:
                transform 0.2s ease,
                background 0.2s ease;
        }

        .tech-icon:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.15);
        }

        .tech-icon svg {
            width: 28px;
            height: 28px;
        }


        /* =========================================================
           9. MOBILE
        ========================================================= */

        @media (max-width: 420px) {
            .container {
                width: calc(100% - 18px);
                margin: 12px auto;
            }

            .card {
                padding: 15px;
            }

            .clock {
                font-size: 22px;
            }
        }
    </style>
</head>
