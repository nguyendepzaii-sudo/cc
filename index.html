<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050507">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Hồ sơ cá nhân và không gian âm nhạc của spekco.">
  <meta property="og:type" content="profile">
  <meta property="og:title" content="spekco | Profile">
  <meta property="og:description" content="Hồ sơ cá nhân và không gian âm nhạc của spekco — Making memories.">
  <meta property="og:image" content="avatar.jpg">
  <meta property="og:url" content="https://spekco.xyz/">
  <meta property="og:site_name" content="spekco.xyz">
  <title>spekco | Profile</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap">

  <style>
    :root {
      color-scheme: dark;
      --bg-canvas: #050507;
      --bg-surface: rgba(14, 15, 20, 0.88);
      --bg-card-solid: #0d0e13;
      --bg-elevated: rgba(255, 255, 255, 0.04);
      --bg-interactive: rgba(255, 255, 255, 0.075);
      --bg-interactive-hover: rgba(255, 255, 255, 0.11);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.17);
      --text-primary: #f4f5f7;
      --text-secondary: #c8ccd4;
      --text-muted: #8b909c;
      --text-dim: #5e636e;
      --accent-white: #ffffff;
      --status-warn: #fbbf24;
      --status-error: #f87171;
      --font-body: "Be Vietnam Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --font-display: "Space Grotesk", "Be Vietnam Pro", -apple-system, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-text-size-adjust: 100%;
      overflow-x: hidden;
    }

    ::selection {
      background: rgba(255, 255, 255, 0.18);
      color: #ffffff;
    }

    body {
      position: relative;
      isolation: isolate;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding:
        max(18px, env(safe-area-inset-top))
        max(14px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(14px, env(safe-area-inset-left));
      background: radial-gradient(circle at 50% 0%, #11131c 0%, var(--bg-canvas) 65%);
    }

    @media (min-width: 640px) {
      body {
        padding: 44px 24px;
      }
    }

    /* Nền sao chiều sâu tối giản */
    #starfield {
      position: fixed;
      inset: 0;
      z-index: -1;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0.75;
    }

    button, input, a {
      color: inherit;
      font: inherit;
    }

    button {
      cursor: pointer;
      background: none;
      border: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    a {
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    :focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.85);
      outline-offset: 2px;
    }

    /* Khung kiến trúc chính */
    .editorial-shell {
      width: 100%;
      max-width: 412px;
      border-radius: 24px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.78);
      overflow: hidden;
    }

    /* 1. Thanh đồng hồ đỉnh trang */
    .masthead {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border-subtle);
      font-size: 11.5px;
      color: var(--text-muted);
      background: rgba(8, 9, 12, 0.45);
    }

    .masthead-clock {
      font-family: var(--font-mono);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      color: var(--text-muted);
      letter-spacing: 0.02em;
      flex-shrink: 0;
    }

    /* 2. Khu vực Banner + Avatar đè mép + Tên + Social Row */
    .profile-section {
      position: relative;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .banner-wrapper {
      position: relative;
      width: 100%;
      height: 148px;
      overflow: hidden;
      background-color: #090d16;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    @media (min-width: 480px) {
      .banner-wrapper {
        height: 162px;
      }
    }

    /* Lớp nền Aurora nghệ thuật tự động hiển thị khi chưa có file banner.jpg hoặc ảnh lỗi */
    .banner-fallback-art {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(120% 90% at 75% 15%, rgba(45, 212, 191, 0.28) 0%, transparent 55%),
        radial-gradient(100% 80% at 25% 20%, rgba(56, 189, 248, 0.22) 0%, transparent 60%),
        radial-gradient(90% 90% at 50% 0%, rgba(139, 92, 246, 0.2) 0%, transparent 65%),
        linear-gradient(180deg, #070b14 0%, #0d1322 62%, #0d0e13 100%);
    }

    .banner-fallback-art svg {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 68%;
      opacity: 0.55;
      pointer-events: none;
    }

    .banner-image {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      transition: transform 0.5s ease, opacity 0.3s ease;
    }

    .banner-wrapper.has-error .banner-image {
      display: none;
    }

    /* Lớp phủ chuyển sắc đáy banner giúp watermark và avatar nổi bật */
    .banner-wrapper::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: linear-gradient(
        180deg,
        rgba(5, 5, 7, 0.08) 0%,
        rgba(5, 5, 7, 0.18) 55%,
        rgba(13, 14, 19, 0.88) 100%
      );
    }

    .banner-watermark {
      position: absolute;
      left: 16px;
      bottom: 12px;
      z-index: 3;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(244, 245, 247, 0.62);
      pointer-events: none;
      user-select: none;
    }

    @media (max-width: 350px) {
      .banner-watermark {
        font-size: 9px;
        left: 12px;
      }
    }

    .profile-body {
      position: relative;
      z-index: 4;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* Avatar tròn căn giữa đè lên mép dưới của banner */
    .avatar-container {
      position: relative;
      width: 88px;
      height: 88px;
      margin-top: -44px;
      aspect-ratio: 1 / 1;
      flex-shrink: 0;
      border-radius: 50%;
      padding: 4px;
      background-color: var(--bg-card-solid);
      box-shadow:
        0 8px 24px rgba(0, 0, 0, 0.65),
        0 0 0 1px rgba(255, 255, 255, 0.12);
    }

    .avatar-inner {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      background-color: #141720;
    }

    .avatar-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .avatar-fallback {
      display: none;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 600;
      color: var(--text-primary);
      background: linear-gradient(145deg, #1e222d, #0f1117);
    }

    .avatar-container.has-error .avatar-image {
      display: none;
    }

    .avatar-container.has-error .avatar-fallback {
      display: flex;
    }

    .profile-copy {
      margin-top: 12px;
      width: 100%;
      min-width: 0;
    }

    .profile-name {
      margin: 0;
      font-family: var(--font-display);
      font-size: 26px;
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .profile-bio {
      margin: 6px auto 0;
      min-height: 1.45em;
      max-width: 92%;
      font-size: 13.5px;
      line-height: 1.5;
      color: var(--text-muted);
      word-break: break-word;
    }

    .bio-caret {
      display: inline-block;
      width: 1.5px;
      height: 1em;
      margin-left: 3px;
      vertical-align: -2px;
      background-color: var(--text-secondary);
      animation: caret-blink 1.1s steps(1) infinite;
    }

    /* Hàng nút Liên kết mạng xã hội dạng vuông bo góc */
    .social-grid {
      margin-top: 18px;
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .social-tile {
      position: relative;
      flex: 1 1 64px;
      max-width: 82px;
      min-width: 56px;
      height: 54px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      background-color: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      transition:
        background-color 0.18s ease,
        border-color 0.18s ease,
        color 0.18s ease,
        transform 0.14s ease,
        box-shadow 0.18s ease;
    }

    .social-tile:hover {
      background-color: var(--bg-interactive);
      border-color: var(--border-strong);
      color: var(--accent-white);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
    }

    .social-tile:active {
      transform: scale(0.95);
      background-color: var(--bg-interactive-hover);
    }

    .social-tile svg {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      transition: transform 0.18s ease;
    }

    .social-tile:hover svg {
      transform: scale(1.06);
    }

    /* Tooltip hiển thị tên nền tảng khi hover hoặc focus bằng bàn phím */
    .social-tile[data-tooltip]::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: calc(100% + 7px);
      left: 50%;
      transform: translate(-50%, 4px);
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(18, 20, 26, 0.96);
      border: 1px solid var(--border-strong);
      color: var(--text-primary);
      font-size: 11px;
      font-weight: 500;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.16s ease, transform 0.16s ease;
      z-index: 10;
    }

    @media (hover: hover) {
      .social-tile[data-tooltip]:hover::after,
      .social-tile[data-tooltip]:focus-visible::after {
        opacity: 1;
        transform: translate(-50%, 0);
      }
    }

    /* 3. Khu vực Trình phát nhạc (Music Player Section) */
    .player-section {
      padding: 20px 20px 22px;
    }

    .player-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .player-state-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    /* Sóng âm chỉ chuyển động khi thực sự ở trạng thái playing */
    .eq-bars {
      display: inline-flex;
      align-items: flex-end;
      gap: 2px;
      height: 12px;
      flex-shrink: 0;
    }

    .eq-bars i {
      display: block;
      width: 2.5px;
      border-radius: 1px;
      background-color: var(--text-muted);
      transform-origin: bottom;
      transition: height 0.2s ease, background-color 0.2s ease, opacity 0.2s ease;
    }

    .eq-bars i:nth-child(1) { height: 4px; opacity: 0.5; }
    .eq-bars i:nth-child(2) { height: 8px; opacity: 0.5; }
    .eq-bars i:nth-child(3) { height: 5px; opacity: 0.5; }
    .eq-bars i:nth-child(4) { height: 6px; opacity: 0.5; }

    .editorial-shell[data-audio-state="playing"] .eq-bars i {
      background-color: var(--accent-white);
      opacity: 1;
    }

    .editorial-shell[data-audio-state="playing"] .eq-bars i:nth-child(1) {
      height: 11px;
      animation: eq-bounce 0.8s ease-in-out infinite alternate;
    }
    .editorial-shell[data-audio-state="playing"] .eq-bars i:nth-child(2) {
      height: 12px;
      animation: eq-bounce 0.8s ease-in-out -0.35s infinite alternate;
    }
    .editorial-shell[data-audio-state="playing"] .eq-bars i:nth-child(3) {
      height: 9px;
      animation: eq-bounce 0.8s ease-in-out -0.6s infinite alternate;
    }
    .editorial-shell[data-audio-state="playing"] .eq-bars i:nth-child(4) {
      height: 10px;
      animation: eq-bounce 0.8s ease-in-out -0.2s infinite alternate;
    }

    .state-spinner {
      width: 13px;
      height: 13px;
      color: var(--status-warn);
      animation: spin 0.9s linear infinite;
      flex-shrink: 0;
    }

    .track-index-badge {
      font-family: var(--font-mono);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      color: var(--text-dim);
      flex-shrink: 0;
    }

    /* Thông tin bài hát hiện tại */
    .track-info {
      min-width: 0;
      margin-bottom: 14px;
    }

    .song-title {
      margin: 0;
      font-size: 17px;
      font-weight: 600;
      line-height: 1.35;
      color: var(--text-primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .editorial-shell[data-audio-state="error"] .song-title {
      color: var(--status-error);
    }

    .song-subtitle {
      margin: 4px 0 0;
      min-height: 1.35em;
      font-size: 13px;
      line-height: 1.35;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Thanh tua nhạc tối ưu cảm ứng điện thoại (vùng chạm cao 28px) */
    .seek-container {
      margin-bottom: 16px;
    }

    .seek-touch-area {
      position: relative;
      display: flex;
      align-items: center;
      height: 28px;
      width: 100%;
    }

    .audio-range {
      display: block;
      width: 100%;
      height: 4px;
      margin: 0;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.14);
      transition: height 0.15s ease;
    }

    .seek-touch-area:hover .audio-range {
      height: 5px;
    }

    .audio-range:disabled {
      cursor: not-allowed;
      opacity: 0.35;
    }

    .audio-range::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.6);
      transition: transform 0.15s ease;
    }

    .audio-range:not(:disabled)::-webkit-slider-thumb:hover,
    .audio-range:not(:disabled)::-webkit-slider-thumb:active {
      transform: scale(1.22);
    }

    .audio-range::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border: 0;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.6);
      transition: transform 0.15s ease;
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      margin-top: 2px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      color: var(--text-dim);
    }

    /* Cụm nút điều khiển (Vùng chạm >= 44px cho Android & iOS) */
    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .controls-balance-spacer {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
    }

    .controls-main-group {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    @media (max-width: 350px) {
      .controls-main-group {
        gap: 12px;
      }
    }

    .control-btn {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      color: var(--text-secondary);
      background-color: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      transition: background-color 0.18s ease, border-color 0.18s ease, color 0.18s ease, transform 0.12s ease;
    }

    .control-btn:hover {
      background-color: var(--bg-interactive-hover);
      border-color: var(--border-strong);
      color: #ffffff;
    }

    .control-btn:active {
      transform: scale(0.94);
    }

    .control-btn.is-active {
      background-color: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.4);
      color: #ffffff;
    }

    .control-btn svg {
      width: 17px;
      height: 17px;
    }

    .play-btn {
      width: 52px;
      height: 52px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background-color: var(--accent-white);
      color: #050507;
      border: 1px solid #ffffff;
      box-shadow: 0 4px 18px rgba(255, 255, 255, 0.16);
      transition: background-color 0.18s ease, transform 0.12s ease;
    }

    .play-btn:hover {
      background-color: #e6e8ee;
    }

    .play-btn:active {
      transform: scale(0.95);
    }

    .play-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .play-btn .icon-play {
      transform: translateX(1px);
    }

    .play-btn .icon-pause {
      display: none;
    }

    .play-btn.playing .icon-play {
      display: none;
    }

    .play-btn.playing .icon-pause {
      display: block;
    }

    /* 4. Ngăn kéo Danh sách phát (Playlist Drawer) */
    .playlist-drawer {
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      visibility: hidden;
      transition:
        grid-template-rows 0.3s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.22s ease,
        visibility 0s linear 0.3s;
    }

    .playlist-drawer.is-open {
      grid-template-rows: 1fr;
      opacity: 1;
      visibility: visible;
      transition-delay: 0s;
    }

    .playlist-clip {
      min-height: 0;
      overflow: hidden;
    }

    .playlist-inner {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--border-subtle);
    }

    .playlist-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px 10px;
      font-size: 11.5px;
      color: var(--text-muted);
    }

    .playlist-header-title {
      font-weight: 500;
    }

    .playlist-header-count {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-dim);
    }

    .playlist-note {
      margin: 0 0 10px;
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(248, 113, 113, 0.1);
      border: 1px solid rgba(248, 113, 113, 0.25);
      font-size: 12px;
      line-height: 1.4;
      color: var(--status-error);
    }

    .playlist-list {
      margin: 0;
      padding: 0;
      list-style: none;
      max-height: 256px;
      max-height: min(256px, 44dvh);
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
    }

    .playlist-list::-webkit-scrollbar {
      width: 4px;
    }

    .playlist-list::-webkit-scrollbar-track {
      background: transparent;
    }

    .playlist-list::-webkit-scrollbar-thumb {
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.2);
    }

    .pl-item {
      width: 100%;
      min-height: 48px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 10px;
      border-radius: 10px;
      text-align: left;
      color: var(--text-secondary);
      transition: background-color 0.16s ease;
    }

    .pl-item:hover {
      background-color: var(--bg-elevated);
    }

    .pl-item:active {
      background-color: var(--bg-interactive);
    }

    .pl-item:focus-visible {
      outline-offset: -2px;
    }

      display: flex;
      flex-direction: column;
      gap: 2px;
    }

      font-size: 13.5px;

      line-height: 1.35;
      color: var(--text-secondary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;

      line-height: 1.3;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;

      MUSIC_LIBRARY[index] = normalizeTrack(track);
    });

    // Hàm hiển thị Toast dùng chung cho cả Social Links và Music Player
    let globalToastTimer = 0;
    function showToastMessage(message) {
      const toastEl = document.getElementById("toast");
      if (!toastEl || !message) return;
      toastEl.textContent = message;
      toastEl.classList.add("show");
      clearTimeout(globalToastTimer);
      globalToastTimer = window.setTimeout(() => {
        toastEl.classList.remove("show");
      }, 3200);
    }

    // =========================================================================
    // 5. KHỞI TẠO GIAO DIỆN PROFILE, BANNER, SOCIAL LINKS, ĐỒNG HỒ & NỀN SAO
    // =========================================================================
    (() => {
      "use strict";

      const $ = (id) => document.getElementById(id);
      const reducedMotion = Boolean(window.matchMedia?.("(prefers-reduced-motion: reduce)").matches);

      function applyProfile() {
        const profile = PROFILE_CONFIG;
        const avatarImg = $("avatar-img");
        const avatarWrapper = $("avatar-wrapper");
        const avatarInitial = $("avatar-initial");
        const bannerImg = $("banner-img");
        const bannerWrapper = $("banner-wrapper");
        const bannerWatermark = $("banner-watermark");

        $("profile-name")?.replaceChildren(document.createTextNode(profile.username));
        document.title = `${profile.username} | ${profile.titleSuffix}`;

        if (bannerWatermark) {
          bannerWatermark.textContent = profile.bannerWatermark || "";
          bannerWatermark.hidden = !profile.bannerWatermark;
        }

        if (bannerImg && bannerWrapper) {
          if (!profile.banner || String(profile.banner).trim() === "") {
            bannerWrapper.classList.add("has-error");
          } else {
            bannerImg.src = profile.banner;
            bannerImg.alt = `Ảnh bìa của ${profile.username}`;
            bannerImg.addEventListener("error", () => {
              bannerWrapper.classList.add("has-error");
            }, { once: true });
          }
        }

        if (avatarInitial) {
          avatarInitial.textContent = profile.username.charAt(0).toUpperCase();
        }

        if (avatarImg && avatarWrapper) {
          if (!profile.avatar || String(profile.avatar).trim() === "") {
            avatarWrapper.classList.add("has-error");
          } else {
            avatarImg.src = profile.avatar;
            avatarImg.alt = `Ảnh đại diện của ${profile.username}`;
            avatarImg.addEventListener("error", () => {
              avatarWrapper.classList.add("has-error");
            }, { once: true });
          }
        }
      }

      function isConfiguredExternalUrl(rawUrl) {
        if (!rawUrl || typeof rawUrl !== "string") return false;
        const trimmed = rawUrl.trim();
        if (
          !trimmed ||
          trimmed === "#" ||
          trimmed.startsWith("YOUR_")
        ) {
          return false;
        }
        try {
          const parsed = new URL(trimmed);
          return ["http:", "https:", "mailto:"].includes(parsed.protocol);
        } catch {
          return false;
        }
      }

      function renderSocialLinks() {
        const nav = $("social-links");
        if (!nav) return;

        const activeLinks = SOCIAL_LINKS.filter((item) => item && item.enabled !== false);

        if (activeLinks.length === 0) {
          nav.hidden = true;
          return;
        }

        const fragment = document.createDocumentFragment();
        activeLinks.forEach((link) => {
          const hasValidUrl = isConfiguredExternalUrl(link.url);
          const element = document.createElement(hasValidUrl ? "a" : "button");
          element.className = "social-tile";
          element.setAttribute("aria-label", link.label);
          element.setAttribute("data-tooltip", link.label);

          if (hasValidUrl) {
            const cleanUrl = link.url.trim();
            element.href = cleanUrl;
            if (!cleanUrl.startsWith("mailto:")) {
              element.target = "_blank";
              element.rel = "noopener noreferrer";
            }
          } else {
            element.type = "button";
            element.addEventListener("click", () => {
              const textToCopy = String(link.copyText || "").trim();
              if (textToCopy && navigator.clipboard?.writeText) {
                navigator.clipboard.writeText(textToCopy).then(() => {
                  showToastMessage(`Đã sao chép ${link.label}: ${textToCopy}`);
                }).catch(() => {
                  showToastMessage(`${link.label}: ${textToCopy}`);
                });
              } else {
                showToastMessage(`Chưa cấu hình URL ${link.label}`);
              }
            });
          }

          element.innerHTML = SOCIAL_ICONS[link.icon] || SOCIAL_ICONS.globe;
          fragment.appendChild(element);
        });

        nav.replaceChildren(fragment);
        nav.hidden = false;
      }

      function startTyping() {
        const quote = $("quote");
        const text = PROFILE_CONFIG.bio || "";
        if (!quote) return;
        if (!text || reducedMotion) {
          quote.textContent = text;
          return;
        }
        quote.textContent = "";
        let index = 0;
        const type = () => {
          quote.textContent = text.slice(0, index++);
          if (index <= text.length) window.setTimeout(type, 65);
        };
        window.setTimeout(type, 180);
      }

      function initClock() {
        const clock = $("clock");
        if (!clock) return;
        let formatter;
        try {
          formatter = new Intl.DateTimeFormat("vi-VN", {
            timeZone: PROFILE_CONFIG.timezone,
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: false
          });
        } catch {
          formatter = new Intl.DateTimeFormat("vi-VN", {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: false
          });
        }
        const prefix = PROFILE_CONFIG.timezoneShortLabel ? `${PROFILE_CONFIG.timezoneShortLabel} · ` : "";
        const update = () => {
          clock.textContent = `${prefix}${formatter.format(new Date())}`;
        };
        update();
        window.setInterval(update, 1000);
      }

      function initStars() {
        const canvas = $("starfield");
        const ctx = canvas?.getContext("2d", { alpha: true });
        if (!canvas || !ctx) return;

        const mobile = Boolean(window.matchMedia?.("(max-width: 600px)").matches);
        const lowPower = (navigator.hardwareConcurrency || 8) <= 4;
        const motionFactor = reducedMotion ? 0 : 1;
        const tints = ["255,255,255", "220,225,235", "190,198,212"];

        let width = 0;
        let height = 0;
        let ratio = 1;
        let stars = [];
        let running = !document.hidden;
        let frameId = 0;
        let last = 0;

        function makeStar(anywhere) {
          const z = Math.random();
          return {
            x: Math.random() * width,
            y: anywhere ? Math.random() * height : height + 10,
            z,
            size: 0.4 + z * 1.3,
            vx: 2 + z * 8,
            vy: -(6 + z * 22),
            alpha: 0.18 + z * 0.5,
            phase: Math.random() * 6.28,
            tw: 0.8 + Math.random() * 1.6,
            tint: tints[(Math.random() * tints.length) | 0]
          };
        }

        function resize() {
          ratio = Math.min(window.devicePixelRatio || 1, mobile ? 1.5 : 1.5);
          width = window.innerWidth;
          height = window.innerHeight;
          canvas.width = width * ratio;
          canvas.height = height * ratio;
          canvas.style.width = `${width}px`;
          canvas.style.height = `${height}px`;
          ctx.setTransform(ratio, 0, 0, ratio, 0, 0);

          let count = mobile
            ? PROFILE_CONFIG.stars.mobileMax
            : Math.min(
                PROFILE_CONFIG.stars.desktopMax,
                Math.max(80, Math.round((width * height) / 11000))
              );
          if (lowPower) count = Math.round(count * 0.7);
          stars = Array.from({ length: count }, () => makeStar(true));
          drawStaticOrFrame(performance.now());
        }

        function drawStaticOrFrame(time) {
          const dt = last ? Math.min(0.05, (time - last) / 1000) : 0.016;
          last = time;
          ctx.clearRect(0, 0, width, height);

          for (const s of stars) {
            if (motionFactor > 0) {
              s.x += s.vx * dt * motionFactor;
              s.y += s.vy * dt * motionFactor;
              if (s.y < -10 || s.x > width + 10) {
                Object.assign(s, makeStar(false));
                s.x = Math.random() * width;
              }
            }
            const a = motionFactor > 0
              ? s.alpha * (0.75 + Math.sin((time / 1000) * s.tw + s.phase) * 0.25)
              : s.alpha;
            ctx.fillStyle = `rgba(${s.tint},${a})`;
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        function frame(time) {
          if (!running) return;
          drawStaticOrFrame(time);
          if (motionFactor > 0) {
            frameId = requestAnimationFrame(frame);
          }
        }

        function setRunning(value) {
          running = value;
          if (motionFactor === 0) return;
          if (running && !frameId) {
            last = 0;
            frameId = requestAnimationFrame(frame);
          } else if (!running && frameId) {
            cancelAnimationFrame(frameId);
            frameId = 0;
          }
        }

        window.addEventListener("resize", resize, { passive: true });
        document.addEventListener("visibilitychange", () => setRunning(!document.hidden));
        resize();
        setRunning(!document.hidden);
      }

      try {
        applyProfile();
        renderSocialLinks();
        startTyping();
        initClock();
        initStars();
      } catch (error) {
        console.error("Profile initialization error:", error);
      }
    })();

    // =========================================================================
    // 6. LOGIC TRÌNH PHÁT NHẠC
    // =========================================================================
    (() => {
      "use strict";

      const $ = (id) => document.getElementById(id);
      const audio = $("audio-player");
      const ui = {
        shell: $("app-shell"),
        spinner: $("loading-spinner"),
        counter: $("track-counter"),
        title: $("song-name"),
        subtitle: $("song-artist"),
        progress: $("progress"),
        current: $("current-time"),
        duration: $("duration"),
        play: $("play-button"),
        previous: $("prev-button"),
        next: $("next-button")
      };

      if (!audio || !ui.title || !ui.subtitle || !ui.progress || !ui.duration || !ui.play) return;

      const state = {
        index: 0,
        fsm: "loading",
        playingRequested: false,
        isSwitchingTrack: false,
        isDraggingSeek: false,
        lastObservedTime: 0,
        tried: new Set(),
        skipTimer: 0
      };

      const pl = {
        button: $("playlist-button"),
        panel: $("playlist-panel"),
        list: $("playlist-list"),
        count: $("playlist-count"),
        note: $("playlist-note")
      };

      const playlistReady = Boolean(pl.button && pl.panel && pl.list);
      const failedTracks = new Set();
      const reduceMotion = Boolean(window.matchMedia?.("(prefers-reduced-motion: reduce)").matches);

      const formatTime = (value) => {
        if (!Number.isFinite(value) || value < 0) return "0:00";
        const seconds = Math.floor(value);
        return `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, "0")}`;
      };

      const hasDuration = () => Number.isFinite(audio.duration) && audio.duration > 0;

      const setSliderVisualFill = (percent) => {
        const clamped = Math.min(100, Math.max(0, Number(percent) || 0));
        ui.progress.style.background = `linear-gradient(to right, #FFFFFF ${clamped}%, rgba(255,255,255,0.14) ${clamped}%)`;
      };

      const notify = (message) => showToastMessage(message);

      const updateCounter = () => {
        if (!ui.counter) return;
        if (!MUSIC_LIBRARY.length) {
          ui.counter.textContent = "00 / 00";
          return;
        }
        ui.counter.textContent = `${String(state.index + 1).padStart(2, "0")} / ${String(MUSIC_LIBRARY.length).padStart(2, "0")}`;
      };

      function transitionAudioState(nextFsmState) {
        state.fsm = nextFsmState;
        const currentTrack = MUSIC_LIBRARY[state.index] || null;
        const artistName = currentTrack?.artist ? currentTrack.artist.trim() : "";

        ui.shell?.setAttribute("data-audio-state", nextFsmState);

        if (ui.spinner) {
          ui.spinner.hidden = !(nextFsmState === "loading" || nextFsmState === "buffering");
        }

        ui.subtitle.textContent = artistName;
        ui.subtitle.hidden = !artistName;

        const isActivelyPlaying = nextFsmState === "playing" || (nextFsmState === "buffering" && !audio.paused);
        ui.play.classList.toggle("playing", isActivelyPlaying);
        ui.play.setAttribute("aria-label", isActivelyPlaying ? "Tạm dừng" : "Phát nhạc");

        if ("mediaSession" in navigator) {
          try {
            navigator.mediaSession.playbackState = isActivelyPlaying
              ? "playing"
              : (nextFsmState === "paused" ? "paused" : "none");
          } catch {}
        }
      }

      const updateProgressUI = () => {
        if (state.isDraggingSeek) return;
        const cur = Number.isFinite(audio.currentTime) ? audio.currentTime : 0;
        ui.current.textContent = formatTime(cur);

        if (!hasDuration()) {
          ui.duration.textContent = "0:00";
          ui.progress.disabled = true;
          ui.progress.value = "0";
          setSliderVisualFill(0);
          return;
        }

        ui.duration.textContent = formatTime(audio.duration);
        ui.progress.disabled = false;
        const pct = Math.min(100, Math.max(0, (cur / audio.duration) * 100));
        ui.progress.value = String(pct);
        setSliderVisualFill(pct);
      };

      const renderTrackHeader = (track) => {
        if (!track) {
          ui.title.textContent = "Không có bài hát";
          ui.title.title = "";
          ui.subtitle.textContent = "";
          ui.subtitle.hidden = true;
          updateCounter();
          return;
        }
        const artistName = track.artist ? track.artist.trim() : "";
        ui.title.textContent = track.title;
        ui.title.title = artistName ? `${track.title} — ${artistName}` : track.title;
        ui.subtitle.textContent = artistName;
        ui.subtitle.hidden = !artistName;
        updateCounter();

        if ("mediaSession" in navigator && typeof MediaMetadata !== "undefined") {
          try {
            navigator.mediaSession.metadata = new MediaMetadata({
              title: track.title,
              artist: artistName || PROFILE_CONFIG.username
            });
          } catch {}
        }
      };

      const resolvedUrls = (source) => {
        const names = [...new Set([source, source.normalize("NFC"), source.normalize("NFD")])];
        return names.map((name) => {
          try {
            return new URL(name, document.baseURI).href;
          } catch {
            return name;
          }
        });
      };

      const getErrorDescription = () => ({
        1: "Quá trình tải bài hát bị hủy.",
        2: "Lỗi kết nối mạng hoặc không tìm thấy file nhạc.",
        3: "Không thể giải mã tập tin âm thanh này.",
        4: "Định dạng nhạc không được hỗ trợ trên thiết bị."
      }[audio.error?.code] || "Không thể phát bài hát này, đang chuyển bài kế tiếp.");

      function requestPlay() {
        if (!MUSIC_LIBRARY.length) {
          renderTrackHeader(null);
          notify("Danh sách phát đang trống.");
          return;
        }

        state.playingRequested = true;

        if (audio.readyState < 2) {
          transitionAudioState("loading");
        }

        const playPromise = audio.play();
        if (playPromise && typeof playPromise.then === "function") {
          playPromise
            .then(() => {
              if (!audio.paused && !audio.ended) {
                transitionAudioState(audio.readyState >= 3 ? "playing" : "buffering");
                updateProgressUI();
              }
            })
            .catch((error) => {
              state.playingRequested = false;
              if (error?.name === "NotAllowedError") {
                transitionAudioState(audio.currentTime > 0 ? "paused" : "ready");
                notify("Chạm nút Phát để bắt đầu nghe nhạc.");
              } else if (error?.name !== "AbortError") {
                transitionAudioState("error");
                notify("Không thể khởi chạy trình phát âm thanh.");
              }
            });
        }
      }

      function loadTrack(index, autoplay = false) {
        if (!MUSIC_LIBRARY.length) return;
        clearTimeout(state.skipTimer);

        state.isSwitchingTrack = true;
        state.index = ((index % MUSIC_LIBRARY.length) + MUSIC_LIBRARY.length) % MUSIC_LIBRARY.length;
        state.playingRequested = autoplay;
        state.lastObservedTime = 0;

        const track = MUSIC_LIBRARY[state.index];

        audio.pause();
        renderTrackHeader(track);
        transitionAudioState("loading");

        ui.progress.disabled = true;
        ui.progress.value = "0";
        setSliderVisualFill(0);
        ui.current.textContent = "0:00";
        ui.duration.textContent = "0:00";

        audio.src = resolvedUrls(track.src)[0];
        audio.load();
        state.isSwitchingTrack = false;

        onTrackChanged();
        if (autoplay) {
          requestPlay();
        }
      }

      function handleAudioError() {
        const failedIndex = state.index;
        state.tried.add(failedIndex);
        failedTracks.add(failedIndex);
        syncPlaylist();
        transitionAudioState("error");

        console.warn("Audio source skipped due to error:", {
          index: failedIndex,
          track: MUSIC_LIBRARY[failedIndex]?.title,
          src: audio.currentSrc || audio.src,
          errorCode: audio.error?.code
        });

        if (state.tried.size >= MUSIC_LIBRARY.length) {
          notify("Không thể tải các bài hát trong danh sách.");
          return;
        }

        notify(getErrorDescription());
        clearTimeout(state.skipTimer);
        state.skipTimer = window.setTimeout(() => {
          loadTrack(failedIndex + 1, state.playingRequested);
        }, 380);
      }

      function nextTrack(autoplay = !audio.paused || state.playingRequested) {
        state.tried.clear();
        loadTrack(state.index + 1, autoplay);
      }

      function previousTrack() {
        if (audio.currentTime > 3) {
          audio.currentTime = 0;
          updateProgressUI();
        } else {
          state.tried.clear();
          loadTrack(state.index - 1, !audio.paused || state.playingRequested);
        }
      }

      ui.play.addEventListener("click", () => {
        if (!MUSIC_LIBRARY.length) {
          notify("Danh sách phát đang trống.");
          return;
        }
        if (!audio.paused && !audio.ended) {
          state.playingRequested = false;
          audio.pause();
        } else {
          requestPlay();
        }
      });

      ui.next?.addEventListener("click", () => nextTrack());
      ui.previous?.addEventListener("click", previousTrack);

      ui.progress.addEventListener("input", () => {
        state.isDraggingSeek = true;
        const pct = Number(ui.progress.value);
        setSliderVisualFill(pct);
        if (hasDuration()) {
          ui.current.textContent = formatTime((pct / 100) * audio.duration);
        }
      });

      ui.progress.addEventListener("change", () => {
        if (hasDuration()) {
          const targetTime = (Number(ui.progress.value) / 100) * audio.duration;
          audio.currentTime = targetTime;
          state.lastObservedTime = targetTime;
        }
        state.isDraggingSeek = false;
        updateProgressUI();
      });

      audio.addEventListener("loadstart", () => {
        transitionAudioState("loading");
      });

      audio.addEventListener("loadedmetadata", () => {
        if (failedTracks.delete(state.index)) {
          syncPlaylist();
        }
        updateProgressUI();
        if (audio.paused && !state.playingRequested) {
          transitionAudioState(audio.currentTime > 0 ? "paused" : "ready");
        }
      });

      audio.addEventListener("canplay", () => {
        updateProgressUI();
        if (!audio.paused && !audio.ended) {
          transitionAudioState("playing");
        } else if (!state.playingRequested) {
          transitionAudioState(audio.currentTime > 0 ? "paused" : "ready");
        }
      });

      audio.addEventListener("canplaythrough", () => {
        if (!audio.paused && !audio.ended) {
          transitionAudioState("playing");
        }
      });

      audio.addEventListener("playing", () => {
        state.tried.clear();
        transitionAudioState("playing");
        updateProgressUI();
      });

      audio.addEventListener("waiting", () => {
        if (!audio.paused && !audio.ended) {
          transitionAudioState("buffering");
        }
      });

      audio.addEventListener("timeupdate", () => {
        updateProgressUI();
        if (!audio.paused && !audio.ended && audio.readyState >= 2) {
          if (state.fsm !== "playing" && (audio.currentTime > state.lastObservedTime || audio.readyState >= 3)) {
            transitionAudioState("playing");
          }
          state.lastObservedTime = audio.currentTime;
        }
      });

      audio.addEventListener("durationchange", updateProgressUI);
      audio.addEventListener("seeked", () => {
        updateProgressUI();
        if (!audio.paused && !audio.ended && audio.readyState >= 3) {
          transitionAudioState("playing");
        }
      });

      audio.addEventListener("pause", () => {
        if (state.isSwitchingTrack || audio.ended) return;
        if (!state.playingRequested) {
          transitionAudioState(audio.currentTime > 0 ? "paused" : "ready");
        }
      });

      audio.addEventListener("ended", () => {
        transitionAudioState("ended");
        nextTrack(true);
      });

      audio.addEventListener("error", handleAudioError);

      if ("mediaSession" in navigator) {
        for (const [action, handler] of Object.entries({
          play: requestPlay,
          pause: () => {
            state.playingRequested = false;
            audio.pause();
          },
          nexttrack: () => nextTrack(),
          previoustrack: previousTrack
        })) {
          try {
            navigator.mediaSession.setActionHandler(action, handler);
          } catch {}
        }
      }

      // =========================================================================
      // 7. QUẢN LÝ DANH SÁCH BÀI HÁT (PLAYLIST) & ĐỒNG BỘ CLOUDFLARE R2
      // =========================================================================
      const trackKey = (src) => {
        let name = String(src || "");
        try {
          name = new URL(name, document.baseURI).pathname.split("/").filter(Boolean).pop() || "";
        } catch {}
        try {
          name = decodeURIComponent(name);
        } catch {}
        return name.normalize("NFC").toLowerCase();
      };

      function setNote(text) {
        if (!pl.note) return;
        pl.note.textContent = text || "";
        pl.note.hidden = !text;
      }

      function renderPlaylist() {
        if (!playlistReady) return;
        const fragment = document.createDocumentFragment();

        MUSIC_LIBRARY.forEach((track, index) => {
          const item = document.createElement("li");
          const button = document.createElement("button");
          button.type = "button";
          button.className = "pl-item";
          button.dataset.index = String(index);
          button.title = track.artist ? `${track.title} — ${track.artist}` : track.title;

          const indexCol = document.createElement("span");
          indexCol.className = "pl-index-col";
          indexCol.setAttribute("aria-hidden", "true");

          const number = document.createElement("span");
          number.className = "pl-num";
          number.textContent = String(index + 1).padStart(2, "0");

          const miniEq = document.createElement("span");
          miniEq.className = "pl-mini-eq";
          miniEq.append(
            document.createElement("i"),
            document.createElement("i"),
            document.createElement("i")
          );
          indexCol.append(number, miniEq);

          const meta = document.createElement("span");
          meta.className = "pl-meta";

          const title = document.createElement("span");
          title.className = "pl-title";
          title.textContent = track.title;
          meta.appendChild(title);

          if (track.artist) {
            const artist = document.createElement("span");
            artist.className = "pl-artist";
            artist.textContent = track.artist;
            meta.appendChild(artist);
          }

          button.append(indexCol, meta);
          item.appendChild(button);
          fragment.appendChild(item);
        });

        if (!MUSIC_LIBRARY.length) {
          const empty = document.createElement("li");
          empty.className = "pl-empty";
          empty.textContent = "Chưa có bài hát nào trong danh sách";
          fragment.appendChild(empty);
        }

        pl.list.replaceChildren(fragment);
        if (pl.count) {
          pl.count.textContent = MUSIC_LIBRARY.length ? `${MUSIC_LIBRARY.length} bài` : "";
        }
        updateCounter();
        syncPlaylist();
      }

      function syncPlaylist() {
        if (!playlistReady) return;
        for (const button of pl.list.querySelectorAll(".pl-item")) {
          const index = Number(button.dataset.index);
          const current = index === state.index;
          button.classList.toggle("is-current", current);
          button.classList.toggle("is-failed", failedTracks.has(index));
          if (current) {
            button.setAttribute("aria-current", "true");
          } else {
            button.removeAttribute("aria-current");
          }
        }
      }

      function scrollToCurrent(smooth) {
        if (!playlistReady) return;
        const current = pl.list.querySelector(".pl-item.is-current");
        if (!current) return;
        const top = current.offsetTop - (pl.list.clientHeight - current.offsetHeight) / 2;
        pl.list.scrollTo({
          top: Math.max(0, top),
          behavior: smooth && !reduceMotion ? "smooth" : "auto"
        });
      }

      function onTrackChanged() {
        if (!playlistReady) return;
        syncPlaylist();
        if (pl.panel.classList.contains("is-open")) {
          scrollToCurrent(true);
        }
      }

      function setPlaylistOpen(open) {
        if (!playlistReady) return;
        pl.panel.classList.toggle("is-open", open);
        pl.panel.setAttribute("aria-hidden", String(!open));
        pl.button.setAttribute("aria-expanded", String(open));
        pl.button.setAttribute("aria-label", open ? "Đóng danh sách nhạc" : "Mở danh sách nhạc");
        pl.button.classList.toggle("is-active", open);
        if (open) {
          refreshR2Index();
          scrollToCurrent(false);
        } else if (pl.panel.contains(document.activeElement)) {
          pl.button.focus();
        }
      }

      let r2LoadedAt = 0;
      let r2Busy = false;
      const buildR2Url = (key) =>
        MUSIC_SETTINGS.r2Base + String(key).replace(/^\/+/, "").split("/").map(encodeURIComponent).join("/");

      function toR2Track(entry) {
        const raw = typeof entry === "string" ? { src: entry } : entry;
        if (!raw || typeof raw !== "object") return null;
        let src = String(raw.src || raw.url || "");
        if (!src && (raw.key || raw.name)) src = buildR2Url(raw.key || raw.name);
        else if (src && !/^(https?:)?\/\//i.test(src) && !src.startsWith("/")) src = buildR2Url(src);
        if (!src || !MUSIC_SETTINGS.audioExt.test(trackKey(src))) return null;
        return normalizeTrack({ src, title: raw.title, artist: raw.artist });
      }

      async function refreshR2Index(force = false) {
        if (!MUSIC_SETTINGS.r2IndexUrl || r2Busy) return;
        if (!force && r2LoadedAt && Date.now() - r2LoadedAt < MUSIC_SETTINGS.r2CacheMs) return;
        r2Busy = true;
        const controller = typeof AbortController === "function" ? new AbortController() : null;
        const timer = window.setTimeout(() => controller?.abort(), 8000);
        try {
          const response = await fetch(MUSIC_SETTINGS.r2IndexUrl, {
            cache: "no-cache",
            signal: controller?.signal
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const data = await response.json();
          const entries = Array.isArray(data) ? data : (data?.files || data?.tracks || data?.objects);
          if (!Array.isArray(entries)) throw new Error("Invalid R2 index");
          const known = new Set(MUSIC_LIBRARY.map((track) => trackKey(track.src)));
          const fresh = [];
          for (const entry of entries) {
            const track = toR2Track(entry);
            if (!track) continue;
            const key = trackKey(track.src);
            if (known.has(key)) continue;
            known.add(key);
            fresh.push(track);
          }
          fresh.sort((a, b) =>
            String(a.title).localeCompare(String(b.title), "vi", { numeric: true, sensitivity: "base" })
          );
          r2LoadedAt = Date.now();
          setNote("");
          if (fresh.length) {
            MUSIC_LIBRARY.push(...fresh);
            renderPlaylist();
            if (!audio.getAttribute("src")) loadTrack(0, false);
          }
        } catch (error) {
          console.warn("R2 index unavailable:", error);
          setNote("Không tải được chỉ mục từ R2, đang hiển thị danh sách có sẵn.");
        } finally {
          clearTimeout(timer);
          r2Busy = false;
        }
      }

      if (playlistReady) {
        pl.button.addEventListener("click", () => setPlaylistOpen(!pl.panel.classList.contains("is-open")));
        pl.list.addEventListener("click", (event) => {
          const button = event.target?.closest?.(".pl-item");
          if (!button || !pl.list.contains(button)) return;
          const index = Number(button.dataset.index);
          if (!Number.isInteger(index) || index < 0 || index >= MUSIC_LIBRARY.length) return;
          if (index === state.index && !failedTracks.has(index)) {
            ui.play.click();
            return;
          }
          state.tried.clear();
          failedTracks.delete(index);
          loadTrack(index, true);
        });
        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape" && pl.panel.classList.contains("is-open")) {
            setPlaylistOpen(false);
            pl.button.focus();
          }
        });
        renderPlaylist();
      }

      if (MUSIC_LIBRARY.length) {
        loadTrack(0, false);
      } else {
        renderTrackHeader(null);
        transitionAudioState("error");
      }
      refreshR2Index();
    })();
  </script>
</body>
</html>
