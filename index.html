<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Profile cá nhân của spekco — now playing.">
  <meta property="og:type" content="profile">
  <meta property="og:title" content="spekco | Profile">
  <meta property="og:description" content="Một góc nhỏ của spekco — đang nghe nhạc và chill.">
  <meta property="og:image" content="avatar.jpg">
  <meta property="og:url" content="https://spekco.xyz/">
  <meta property="og:site_name" content="spekco.xyz">
  <title>spekco | Profile</title>

  <!-- Google Fonts: Be Vietnam Pro (Body/CJK fallback), Space Grotesk (Display), JetBrains Mono (Tabular Monospace) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@600;700&display=swap">

  <style>
    :root {
      color-scheme: dark;
      --bg-void: #000000;
      --bg-top-glow: #0d1017;
      --text-primary: #f4f5f8;
      --text-secondary: #e4e6ee;
      --text-muted: #9499a6;
      --text-subtle: #8e93a2;
      --text-dim: #7c8290;
      --text-faint: #686e7c;
      --danger: #f87171;
      --font-body: "Be Vietnam Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-display: "Space Grotesk", "Be Vietnam Pro", system-ui, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background-color: var(--bg-void);
      color: var(--text-primary);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-text-size-adjust: 100%;
    }

    ::selection {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
    }

    body {
      position: relative;
      isolation: isolate;
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding:
        max(24px, env(safe-area-inset-top))
        max(14px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(14px, env(safe-area-inset-left));
      overflow-x: hidden;
      background: radial-gradient(ellipse at 50% 0%, var(--bg-top-glow) 0%, var(--bg-void) 62%);
    }

    @media (min-width: 640px) {
      body {
        padding:
          max(40px, env(safe-area-inset-top))
          max(20px, env(safe-area-inset-right))
          max(40px, env(safe-area-inset-bottom))
          max(20px, env(safe-area-inset-left));
      }
    }

    /* Lưới điểm sao tĩnh siêu mảnh tạo chiều sâu nền */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -20;
      pointer-events: none;
      opacity: 0.22;
      background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 36px 36px;
    }

    /* Canvas sao rơi & sao băng */
    #starfield {
      position: fixed;
      inset: 0;
      z-index: -10;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    button, input, a {
      color: inherit;
      font: inherit;
    }

    button {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      background: none;
      border: 0;
      padding: 0;
    }

    a {
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    :focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.85);
      outline-offset: 2px;
    }

    /* Khung bố cục chính (Bento Hardware Module 420px) */
    .main-container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Vật liệu Kính khói quang học (Optical Smoked Glass) */
    .glass-panel {
      position: relative;
      overflow: hidden;
      background: linear-gradient(155deg, rgba(22, 24, 30, 0.78) 0%, rgba(12, 13, 17, 0.84) 100%);
      backdrop-filter: blur(16px) saturate(140%);
      -webkit-backdrop-filter: blur(16px) saturate(140%);
      border: 1px solid rgba(255, 255, 255, 0.085);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.14),
        0 18px 42px rgba(0, 0, 0, 0.65);
    }

    /* Animation khởi đầu tự nhiên */
    @keyframes module-in {
      0% {
        opacity: 0;
        transform: translate3d(0, 20px, 0) scale(0.98);
      }
      100% {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1);
      }
    }

    .main-container > * {
      animation: module-in 0.55s cubic-bezier(0.22, 1, 0.36, 1) backwards;
    }

    .main-container > *:nth-child(2) {
      animation-delay: 0.08s;
    }

    .main-container > *:nth-child(3) {
      animation-delay: 0.16s;
    }

    /* ================= MODULE 1: PROFILE HEADER ================= */
    .profile-header {
      border-radius: 22px;
      padding: 20px;
    }

    @media (min-width: 640px) {
      .profile-header {
        padding: 24px;
      }
    }

    .header-status-bar {
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      padding-bottom: 14px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.09);
      background: rgba(255, 255, 255, 0.03);
      padding: 4px 10px;
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-secondary);
      line-height: 1.3;
    }

    .status-pill svg {
      width: 14px;
      height: 14px;
      color: rgba(255, 255, 255, 0.8);
      flex-shrink: 0;
    }

    .clock-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-variant-numeric: tabular-nums;
      color: var(--text-dim);
    }

    .clock-badge svg {
      width: 14px;
      height: 14px;
      color: rgba(255, 255, 255, 0.5);
      flex-shrink: 0;
    }

    .profile-identity {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    @media (min-width: 640px) {
      .profile-identity {
        gap: 20px;
      }
    }

    .avatar-box {
      position: relative;
      width: 80px;
      height: 80px;
      flex-shrink: 0;
      overflow: hidden;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: #101217;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }

    .avatar-img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .avatar-box:hover .avatar-img {
      transform: scale(1.05);
    }

    .avatar-fallback {
      display: none;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.02));
      font-family: var(--font-display);
      font-size: 26px;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: -0.02em;
    }

    .avatar-box.has-error .avatar-img {
      display: none;
    }

    .avatar-box.has-error .avatar-fallback {
      display: flex;
    }

    .identity-meta {
      min-width: 0;
      flex: 1;
    }

    .username-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      min-width: 0;
    }

    .username {
      margin: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 600;
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    @media (min-width: 640px) {
      .username {
        font-size: 31px;
      }
    }

    .domain-tag {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-faint);
      flex-shrink: 0;
    }

    .bio-line {
      margin: 6px 0 0;
      min-height: 1.5rem;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.6;
      color: #a0a6b4;
    }

    .bio-caret {
      display: inline-block;
      width: 1.5px;
      height: 1.05em;
      margin-left: 4px;
      transform: translateY(2px);
      background-color: var(--text-primary);
      animation: caret-blink 1s steps(1) infinite;
    }

    /* ================= MODULE 2: SOCIAL LINKS ================= */
    .social-nav {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .social-link-card {
      min-height: 50px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-radius: 18px;
      padding: 10px 16px;
      font-size: 14px;
      transition: border-color 0.2s ease, background-color 0.2s ease, transform 0.15s ease;
    }

    .social-link-card:hover {
      border-color: rgba(255, 255, 255, 0.2);
      background: linear-gradient(155deg, rgba(34, 37, 46, 0.82) 0%, rgba(18, 20, 26, 0.88) 100%);
    }

    .social-link-card:active {
      transform: scale(0.99);
    }

    .social-link-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .social-icon-box {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.04);
      color: #d8dce6;
      transition: border-color 0.2s ease, color 0.2s ease;
    }

    .social-icon-box svg {
      width: 16px;
      height: 16px;
    }

    .social-link-card:hover .social-icon-box {
      border-color: rgba(255, 255, 255, 0.18);
      color: #ffffff;
    }

    .social-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 500;
      color: #eceef4;
      transition: color 0.2s ease;
    }

    .social-link-card:hover .social-label {
      color: #ffffff;
    }

    .social-link-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      font-size: 12px;
      color: var(--text-dim);
    }

    .social-handle {
      font-family: var(--font-mono);
      font-size: 11.5px;
      transition: color 0.2s ease;
    }

    .social-link-card:hover .social-handle {
      color: #b4bac8;
    }

    .social-arrow {
      width: 16px;
      height: 16px;
      color: var(--text-faint);
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .social-link-card:hover .social-arrow {
      transform: translate(2px, -2px);
      color: #ffffff;
    }

    /* ================= MODULE 3: MUSIC PLAYER ================= */
    .music-card {
      border-radius: 22px;
      padding: 20px;
    }

    @media (min-width: 640px) {
      .music-card {
        padding: 24px;
      }
    }

    .music-header {
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .music-header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .eq-indicator {
      display: flex;
      height: 14px;
      align-items: flex-end;
      gap: 2.5px;
    }

    .eq-indicator i {
      display: block;
      width: 3px;
      border-radius: 9999px;
      background-color: rgba(255, 255, 255, 0.85);
      transform-origin: bottom;
      transition: height 0.2s ease, opacity 0.2s ease;
    }

    .eq-indicator i:nth-child(1) { height: 6px; opacity: 0.45; }
    .eq-indicator i:nth-child(2) { height: 10px; opacity: 0.45; }
    .eq-indicator i:nth-child(3) { height: 4px; opacity: 0.45; }
    .eq-indicator i:nth-child(4) { height: 8px; opacity: 0.45; }

    .music-card.is-playing .eq-indicator i:nth-child(1) {
      height: 12px;
      opacity: 1;
      animation: eq-bar 0.85s ease-in-out infinite alternate;
    }
    .music-card.is-playing .eq-indicator i:nth-child(2) {
      height: 14px;
      opacity: 1;
      animation: eq-bar 0.85s ease-in-out -0.35s infinite alternate;
    }
    .music-card.is-playing .eq-indicator i:nth-child(3) {
      height: 10px;
      opacity: 1;
      animation: eq-bar 0.85s ease-in-out -0.65s infinite alternate;
    }
    .music-card.is-playing .eq-indicator i:nth-child(4) {
      height: 8px;
      opacity: 1;
      animation: eq-bar 0.85s ease-in-out -0.15s infinite alternate;
    }

    .music-label-text {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.025em;
      color: var(--text-muted);
    }

    .loading-spinner {
      width: 14px;
      height: 14px;
      color: rgba(255, 255, 255, 0.6);
      animation: spin 1s linear infinite;
    }

    .track-counter {
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.07);
      background: rgba(255, 255, 255, 0.03);
      padding: 2px 8px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      color: var(--text-dim);
    }

    /* Màn hình hiển thị bài hát & thanh tiến trình */
    .track-display-screen {
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(0, 0, 0, 0.4);
      padding: 14px 16px;
    }

    .song-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 17px;
      font-weight: 600;
      line-height: 1.38;
      color: var(--text-primary);
    }

    .music-card.has-error .song-title {
      color: var(--danger);
    }

    .song-artist {
      margin-top: 4px;
      min-height: 1.25rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      color: var(--text-subtle);
    }

    .progress-wrapper {
      margin-top: 14px;
    }

    .audio-range {
      display: block;
      width: 100%;
      height: 6px;
      margin: 0;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.14);
    }

    .audio-range:disabled {
      cursor: not-allowed;
      opacity: 0.4;
    }

    .audio-range::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 9999px;
      background: #ffffff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      transition: transform 0.15s ease;
    }

    .audio-range:not(:disabled)::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    .audio-range::-moz-range-thumb {
      width: 13px;
      height: 13px;
      border: 0;
      border-radius: 9999px;
      background: #ffffff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      transition: transform 0.15s ease;
    }

    .audio-range:not(:disabled)::-moz-range-thumb:hover {
      transform: scale(1.2);
    }

    .time-row {
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      color: var(--text-faint);
    }

    /* Cụm nút điều khiển cơ học */
    .controls-bar {
      margin-top: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .controls-spacer {
      width: 44px;
      flex-shrink: 0;
    }

    .controls-Transport {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    @media (max-width: 360px) {
      .controls-Transport {
        gap: 12px;
      }
    }

    .btn-circle {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-secondary);
      transition: border-color 0.2s ease, background-color 0.2s ease, color 0.2s ease, transform 0.15s ease;
    }

    .btn-circle:hover {
      border-color: rgba(255, 255, 255, 0.22);
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }

    .btn-circle:active {
      transform: scale(0.95);
    }

    .btn-circle.is-active {
      border-color: rgba(255, 255, 255, 0.5);
      background: rgba(255, 255, 255, 0.18);
      color: #ffffff;
    }

    .btn-circle svg {
      width: 16px;
      height: 16px;
    }

    .btn-play-main {
      width: 52px;
      height: 52px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 1px solid #ffffff;
      background: #ffffff;
      color: #090a0d;
      box-shadow: 0 4px 20px rgba(255, 255, 255, 0.2);
      transition: background-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
    }

    .btn-play-main:hover {
      background: #e6e8ef;
    }

    .btn-play-main:active {
      transform: scale(0.95);
    }

    .btn-play-main svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .btn-play-main .icon-play {
      transform: translateX(1px);
    }

    .btn-play-main .icon-pause {
      display: none;
    }

    .btn-play-main.playing .icon-play {
      display: none;
    }

    .btn-play-main.playing .icon-pause {
      display: block;
    }

    /* Ngăn kéo Playlist (Grid Transition) */
    .playlist-drawer {
      display: grid;
      grid-template-rows: 0fr;
      margin-top: 0;
      opacity: 0;
      visibility: hidden;
      transition:
        grid-template-rows 0.32s cubic-bezier(0.22, 1, 0.36, 1),
        margin-top 0.32s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.24s ease,
        visibility 0s linear 0.32s;
    }

    .playlist-drawer.is-open {
      grid-template-rows: 1fr;
      margin-top: 16px;
      opacity: 1;
      visibility: visible;
      transition-delay: 0s;
    }

    .playlist-clip {
      min-height: 0;
      overflow: hidden;
    }

    .playlist-box {
      overflow: hidden;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(0, 0, 0, 0.5);
    }

    .playlist-note {
      margin: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding: 8px 14px;
      font-size: 12px;
      line-height: 1.4;
      color: var(--danger);
    }

    .playlist-note svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    .playlist-list {
      margin: 0;
      padding: 8px;
      list-style: none;
      max-height: 268px;
      max-height: min(268px, 46dvh);
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.24) transparent;
    }

    .playlist-list::-webkit-scrollbar {
      width: 5px;
    }

    .playlist-list::-webkit-scrollbar-track {
      background: transparent;
    }

    .playlist-list::-webkit-scrollbar-thumb {
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.24);
    }

    .pl-item {
      width: 100%;
      min-height: 50px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-radius: 12px;
      padding: 8px 10px;
      text-align: left;
      color: var(--text-secondary);
      transition: background-color 0.2s ease, transform 0.15s ease;
    }

    .pl-item:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .pl-item:active {
      transform: scale(0.99);
    }

    .pl-item:focus-visible {
      outline-offset: -2px;
    }

    .pl-badge {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      font-family: var(--font-mono);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      color: var(--text-dim);
    }

    .pl-bars {
      display: none;
      height: 14px;
      align-items: flex-end;
      gap: 2px;

      position: fixed;
      left: 50%;
      bottom: max(24px, env(safe-area-inset-bottom));
      z-index: 50;
      max-width: calc(100vw - 28px);

    const parseTrackMetadata = (source) => {
      if (!source || typeof source !== "string") return { title: "", artist: "" };

      let filename = source;
      try {
        const parsedUrl = new URL(source, document.baseURI);
        const segments = parsedUrl.pathname.split("/").filter(Boolean);
        if (segments.length) filename = segments[segments.length - 1];
      } catch {
        // Không phải URL tuyệt đối — giữ nguyên chuỗi tên file
      }

      try {
        filename = decodeURIComponent(filename);
      } catch {
        // Bỏ qua nếu không phải chuỗi mã hóa URI hợp lệ
      }

      filename = filename.replace(/\.[^.]+$/, "");
      const separator = filename.indexOf(" - ");
      if (separator === -1) return { title: filename.trim(), artist: "" };
      return {
        artist: filename.slice(0, separator).trim(),
        title: filename.slice(separator + 3).trim()
      };
    };

      const src = String(rawObj?.src || rawObj?.url || "");

      return {
        src,

        $("profile-domain")?.replaceChildren(document.createTextNode(`/${profile.username}.xyz`));
        $("status-text")?.replaceChildren(document.createTextNode(profile.statusText));
        $("music-label")?.replaceChildren(document.createTextNode(profile.musicLabel));
        document.title = `${profile.username} \vert{}${profile.titleSuffix}`;

        if (avatarInitial) {
          avatarInitial.textContent = profile.username.charAt(0).toUpperCase();
        }

        if (avatarImg) {
          avatarImg.src = profile.avatar;
          avatarImg.alt = `Ảnh đại diện của ${profile.username}`;
          avatarImg.addEventListener("error", () => {
            avatarWrapper?.classList.add("has-error");
          }, { once: true });
        }

        document.querySelector('meta[name="description"]')?.setAttribute(
          "content",
          `Profile cá nhân của ${profile.username} — now playing.`
        );
        document.querySelector('meta[property="og:title"]')?.setAttribute(
          "content",
          `${profile.username} \vert{}${profile.titleSuffix}`
        );
      }

      function renderSocialLinks() {
        const nav = $("social-links");
        if (!nav) return;

        const validLinks = SOCIAL_LINKS.filter(
          (item) => item && typeof item.url === "string" && item.url.trim().length > 0
        );

        if (validLinks.length === 0) {
          nav.hidden = true;
          return;
        }

        const fragment = document.createDocumentFragment();
        validLinks.forEach((link) => {
          const anchor = document.createElement("a");
          anchor.href = link.url;
          anchor.target = "_blank";
          anchor.rel = "noopener noreferrer";
          anchor.className = "glass-panel social-link-card";

          const left = document.createElement("div");
          left.className = "social-link-left";

          const iconBox = document.createElement("span");
          iconBox.className = "social-icon-box";
          iconBox.innerHTML = LUCIDE_SVGS[link.icon] || LUCIDE_SVGS["globe"];

          const label = document.createElement("span");
          label.className = "social-label";
          label.textContent = link.label;

          left.append(iconBox, label);

          const right = document.createElement("div");
          right.className = "social-link-right";

          if (link.handle) {
            const handle = document.createElement("span");
            handle.className = "social-handle";
            handle.textContent = link.handle;
            right.appendChild(handle);
          }

          right.insertAdjacentHTML("beforeend", LUCIDE_SVGS["arrow-up-right"]);
          anchor.append(left, right);
          fragment.appendChild(anchor);
        });

        nav.replaceChildren(fragment);
        nav.hidden = false;
      }

      function startTyping() {
        const quote = $("quote");
        const text = PROFILE_CONFIG.bio || "";
        if (!quote || !text || reducedMotion) {
          if (quote) quote.textContent = text;
          return;
        }
        let index = 0;
        const type = () => {
          quote.textContent = text.slice(0, index++);
          if (index <= text.length) window.setTimeout(type, 70);
        };
        window.setTimeout(type, 220);
      }

      function initClock() {
        const clock = $("clock");
        if (!clock) return;
        let formatter;
        try {
          formatter = new Intl.DateTimeFormat("vi-VN", {
            timeZone: PROFILE_CONFIG.timezone,
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: false
          });
        } catch {
          formatter = new Intl.DateTimeFormat("vi-VN", {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: false
          });
        }
        const update = () => {
          clock.textContent = formatter.format(new Date());
        };
        update();
        window.setInterval(update, 1000);
      }

      function initStars() {
        const canvas = $("starfield");
        const ctx = canvas?.getContext("2d", { alpha: true });
        if (!canvas || !ctx) return;

        const mobile = Boolean(window.matchMedia?.("(max-width: 600px)").matches);
        const lowPower = (navigator.hardwareConcurrency || 8) <= 4;
        const motionFactor = reducedMotion ? 0.25 : 1;
        const tints = ["255,255,255", "228,231,238", "200,206,218"];

        let width = 0;
        let height = 0;
        let ratio = 1;
        let stars = [];
        let comets = [];
        let nextComet = 1200;
        let running = !document.hidden;
        let frameId = 0;
        let last = 0;

        function makeStar(anywhere) {
          const z = Math.random();
          return {
            x: Math.random() * width,
            y: anywhere ? Math.random() * height : height + 12,
            z,
            size: 0.45 + z * 1.65,
            vx: 4 + z * 14,
            vy: -(11 + z * 42),
            alpha: 0.24 + z * 0.62,
            phase: Math.random() * 7,
            tw: 1.1 + Math.random() * 2.2,
            tint: tints[(Math.random() * tints.length) | 0]
          };
        }

        function resize() {
          ratio = Math.min(window.devicePixelRatio || 1, mobile ? 1.75 : 1.5);
          width = window.innerWidth;
          height = window.innerHeight;
          canvas.width = width * ratio;
          canvas.height = height * ratio;
          canvas.style.width = `${width}px`;
          canvas.style.height = `${height}px`;
          ctx.setTransform(ratio, 0, 0, ratio, 0, 0);

          let count = mobile
            ? PROFILE_CONFIG.stars.mobileMax
            : Math.min(
                PROFILE_CONFIG.stars.desktopMax,
                Math.max(140, Math.round((width * height) / 7500))
              );
          if (lowPower) count = Math.round(count * 0.7);
          stars = Array.from({ length: count }, () => makeStar(true));
        }

        function spawnComet() {
          const speed = (480 + Math.random() * 300) * Math.max(1, width / 1100);
          comets.push({
            x: width * (0.35 + Math.random() * 0.75),
            y: -30 + Math.random() * height * 0.32,
            vx: -speed * 0.82,
            vy: speed * 0.57,
            len: (95 + Math.random() * 75) * Math.max(1, width / 1400)
          });
        }

        function frame(time) {
          if (!running) return;
          const dt = last ? Math.min(0.05, (time - last) / 1000) : 0.016;
          last = time;
          ctx.clearRect(0, 0, width, height);

          for (const s of stars) {
            s.x += s.vx * dt * motionFactor;
            s.y += s.vy * dt * motionFactor;
            if (s.y < -12 || s.x > width + 12) {
              Object.assign(s, makeStar(false));
              s.x = Math.random() * width;
            }
            const a = s.alpha * (0.72 + Math.sin((time / 1000) * s.tw + s.phase) * 0.28);
            ctx.fillStyle = `rgba(${s.tint},${a})`;
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
            ctx.fill();
          }

          if (!reducedMotion && time > nextComet && comets.length < 2) {
            spawnComet();
            nextComet = time + PROFILE_CONFIG.stars.shootingIntervalMs * (0.65 + Math.random() * 0.8);
          }

          comets = comets.filter((c) => {
            c.x += c.vx * dt * motionFactor;
            c.y += c.vy * dt * motionFactor;
            const m = Math.hypot(c.vx, c.vy);
            const tx = c.x - (c.vx / m) * c.len;
            const ty = c.y - (c.vy / m) * c.len;
            const g = ctx.createLinearGradient(c.x, c.y, tx, ty);
            g.addColorStop(0, "rgba(255,255,255,0.92)");
            g.addColorStop(0.3, "rgba(210,220,240,0.4)");
            g.addColorStop(1, "rgba(210,220,240,0)");
            ctx.strokeStyle = g;
            ctx.lineWidth = 1.6;
            ctx.lineCap = "round";
            ctx.beginPath();
            ctx.moveTo(c.x, c.y);
            ctx.lineTo(tx, ty);
            ctx.stroke();
            return c.x > -200 && c.y < height + 200;
          });

          frameId = requestAnimationFrame(frame);
        }

        function setRunning(value) {
          running = value;
          if (running && !frameId) {
            last = 0;
            frameId = requestAnimationFrame(frame);
          }
          if (!running && frameId) {
            cancelAnimationFrame(frameId);
            frameId = 0;
          }
        }

        window.addEventListener("resize", resize, { passive: true });
        document.addEventListener("visibilitychange", () => setRunning(!document.hidden));
        resize();
        setRunning(!document.hidden);
      }

      try {
        applyProfile();
        renderSocialLinks();
        startTyping();
        initClock();
        initStars();
      } catch (error) {
        console.error("Profile initialization failed", error);
      }
    })();

    // =========================================================================
    // 6. LOGIC TRÌNH PHÁT NHẠC & PLAYLIST (Tương đương useAudioPlayer + MusicPlayer)
    // =========================================================================
    (() => {
      "use strict";

      const $ = (id) => document.getElementById(id);
      const audio = $("audio-player");
      const ui = {
        card: $("music-card"),
        title: $("song-name"),
        artist: $("song-artist"),
        progress: $("progress"),
        current: $("current-time"),
        duration: $("duration"),
        play: $("play-button"),
        previous: $("prev-button"),
        next: $("next-button"),
        spinner: $("loading-spinner"),
        counter: $("track-counter"),
        toast: $("toast")
      };

      if (!audio || !ui.title || !ui.artist || !ui.progress || !ui.duration || !ui.play) return;

      const state = {
        index: 0,
        playingRequested: false,
        isDraggingSeek: false,
        tried: new Set(),
        toastTimer: 0
      };

      const pl = {
        button: $("playlist-button"),
        panel: $("playlist-panel"),
        list: $("playlist-list"),
        note: $("playlist-note"),
        noteText: $("playlist-note-text")
      };

      const playlistReady = Boolean(pl.button && pl.panel && pl.list);
      const failedTracks = new Set();
      const reduceMotion = Boolean(window.matchMedia?.("(prefers-reduced-motion: reduce)").matches);

      const formatTime = (value) => {
        if (!Number.isFinite(value) || value < 0) return "0:00";
        const seconds = Math.floor(value);
        return `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, "0")}`;
      };

      const hasDuration = () => Number.isFinite(audio.duration) && audio.duration > 0;

      const setSliderVisualFill = (percent) => {
        const clamped = Math.min(100, Math.max(0, Number(percent) || 0));
        ui.progress.style.background = `linear-gradient(to right, #FFFFFF ${clamped}\%, rgba(255,255,255,0.14)${clamped}%)`;
      };

      const notify = (message) => {
        if (!ui.toast) return;
        ui.toast.textContent = message;
        ui.toast.classList.add("show");
        clearTimeout(state.toastTimer);
        state.toastTimer = window.setTimeout(() => ui.toast.classList.remove("show"), 3200);
      };

      const setClass = (name, enabled) => ui.card?.classList.toggle(name, enabled);

      const setLoading = (loading) => {
        setClass("is-loading", loading);
        if (ui.spinner) ui.spinner.hidden = !loading;
      };

      const updateCounter = () => {
        if (!ui.counter) return;
        if (!MUSIC_LIBRARY.length) {
          ui.counter.textContent = "00 / 00";
          return;
        }
        ui.counter.textContent = `${String(state.index + 1).padStart(2, "0")} / ${String(MUSIC_LIBRARY.length).padStart(2, "0")}`;
      };

      const updateState = () => {
        const playing = !audio.paused && !audio.ended;
        ui.play.classList.toggle("playing", playing);
        ui.play.setAttribute("aria-label", playing ? "Tạm dừng" : "Phát nhạc");
        setClass("is-playing", playing);
      };

      const updateProgress = () => {
        if (state.isDraggingSeek) return;
        ui.current.textContent = formatTime(audio.currentTime);
        if (!hasDuration()) {
          ui.duration.textContent = "0:00";
          ui.progress.disabled = true;
          ui.progress.value = "0";
          setSliderVisualFill(0);
          return;
        }
        ui.duration.textContent = formatTime(audio.duration);
        ui.progress.disabled = false;
        const pct = Math.min(100, Math.max(0, (audio.currentTime / audio.duration) * 100));
        ui.progress.value = String(pct);
        setSliderVisualFill(pct);
      };

      const showTrack = (track) => {
        ui.title.textContent = track?.title || "Không có nhạc";
        ui.artist.textContent = track?.artist || "Đang chờ phát...";
        ui.title.title = track?.title || "";
        updateCounter();

        if (track && "mediaSession" in navigator && typeof MediaMetadata !== "undefined") {
          try {
            navigator.mediaSession.metadata = new MediaMetadata({
              title: track.title,
              artist: track.artist || "spekco playlist"
            });
          } catch {}
        }
      };

      const resolvedUrls = (source) => {
        const names = [...new Set([source, source.normalize("NFC"), source.normalize("NFD")])];
        return names.map((name) => {
          try {
            return new URL(name, document.baseURI).href;
          } catch {
            return name;
          }
        });
      };

      const errorText = () => ({
        1: "Quá trình tải âm thanh bị gián đoạn.",
        2: "Lỗi mạng hoặc không tìm thấy file nhạc.",
        3: "Trình duyệt không thể giải mã định dạng âm thanh này.",
        4: "Định dạng âm thanh không được hỗ trợ trên thiết bị này."
      }[audio.error?.code] || "Không thể tải bài hát này, đang chuyển bài kế tiếp.");

      function playCurrent() {
        if (!MUSIC_LIBRARY.length) {
          showTrack(null);
          notify("Chưa có bài hát nào trong danh sách");
          return;
        }
        state.playingRequested = true;
        Promise.resolve(audio.play()).then(updateState).catch((error) => {
          updateState();
          if (error?.name === "NotAllowedError") notify("Nhấn Play để bắt đầu phát nhạc.");
          else if (error?.name !== "AbortError") notify("Không thể phát bài hát này.");
        });
      }

      function loadTrack(index, autoplay = false) {
        if (!MUSIC_LIBRARY.length) return;
        state.index = ((index % MUSIC_LIBRARY.length) + MUSIC_LIBRARY.length) % MUSIC_LIBRARY.length;
        state.playingRequested = autoplay;
        const track = MUSIC_LIBRARY[state.index];

        audio.pause();
        showTrack(track);
        setClass("has-error", false);
        setLoading(true);
        ui.progress.disabled = true;
        ui.progress.value = "0";
        setSliderVisualFill(0);
        ui.current.textContent = "0:00";
        ui.duration.textContent = "0:00";

        audio.src = resolvedUrls(track.src)[0];
        audio.load();
        onTrackChanged();
        if (autoplay) playCurrent();
      }

      function skipFailedTrack() {
        const failedIndex = state.index;
        state.tried.add(failedIndex);
        failedTracks.add(failedIndex);
        syncPlaylist();
        setClass("has-error", true);
        setLoading(false);

        console.error("Audio load error", {
          track: MUSIC_LIBRARY[failedIndex],
          url: audio.currentSrc || audio.src,
          code: audio.error?.code,
          readyState: audio.readyState,
          networkState: audio.networkState
        });

        if (state.tried.size >= MUSIC_LIBRARY.length) {
          notify("Không tìm thấy bài hát nào khả dụng để phát.");
          return;
        }
        notify(errorText());
        loadTrack(failedIndex + 1, state.playingRequested);
      }

      function nextTrack(autoplay = !audio.paused) {
        state.tried.clear();
        loadTrack(state.index + 1, autoplay);
      }

      function previousTrack() {
        if (audio.currentTime > 3) {
          audio.currentTime = 0;
          updateProgress();
        } else {
          state.tried.clear();
          loadTrack(state.index - 1, !audio.paused);
        }
      }

      ui.play.addEventListener("click", () => {
        if (!MUSIC_LIBRARY.length) return notify("Chưa có bài hát nào");
        if (!audio.paused && !audio.ended) {
          state.playingRequested = false;
          audio.pause();
        } else {
          playCurrent();
        }
      });

      ui.next?.addEventListener("click", () => nextTrack());
      ui.previous?.addEventListener("click", previousTrack);

      ui.progress.addEventListener("input", () => {
        state.isDraggingSeek = true;
        const pct = Number(ui.progress.value);
        setSliderVisualFill(pct);
        if (hasDuration()) {
          ui.current.textContent = formatTime((pct / 100) * audio.duration);
        }
      });

      ui.progress.addEventListener("change", () => {
        if (hasDuration()) {
          audio.currentTime = (Number(ui.progress.value) / 100) * audio.duration;
        }
        state.isDraggingSeek = false;
        updateProgress();
      });

      ["loadstart", "waiting", "stalled"].forEach((event) => {
        audio.addEventListener(event, () => setLoading(true));
      });

      ["loadedmetadata", "loadeddata", "canplay", "playing", "pause", "suspend"].forEach((event) => {
        audio.addEventListener(event, () => {
          setLoading(false);
          updateState();
          updateProgress();
        });
      });

      ["timeupdate", "durationchange", "seeking", "seeked"].forEach((event) => {
        audio.addEventListener(event, updateProgress);
      });

      audio.addEventListener("loadedmetadata", () => {
        if (failedTracks.delete(state.index)) syncPlaylist();
      });

      audio.addEventListener("ended", () => nextTrack(true));
      audio.addEventListener("error", skipFailedTrack);

      if ("mediaSession" in navigator) {
        for (const [action, handler] of Object.entries({
          play: playCurrent,
          pause: () => audio.pause(),
          nexttrack: () => nextTrack(),
          previoustrack: previousTrack
        })) {
          try {
            navigator.mediaSession.setActionHandler(action, handler);
          } catch {}
        }
      }

      // ---------- Quản lý Playlist & Đồng bộ Cloudflare R2 ----------
      const trackKey = (src) => {
        let name = String(src || "");
        try {
          name = new URL(name, document.baseURI).pathname.split("/").filter(Boolean).pop() || "";
        } catch {}
        try {
          name = decodeURIComponent(name);
        } catch {}
        return name.normalize("NFC").toLowerCase();
      };

      function setNote(text) {
        if (!pl.note || !pl.noteText) return;
        pl.noteText.textContent = text || "";
        pl.note.hidden = !text;
      }

      function renderPlaylist() {
        if (!playlistReady) return;
        const fragment = document.createDocumentFragment();

        MUSIC_LIBRARY.forEach((track, index) => {
          const item = document.createElement("li");
          const button = document.createElement("button");
          button.type = "button";
          button.className = "pl-item";
          button.dataset.index = String(index);
          button.title = track.artist ? `${track.title} —${track.artist}` : (track.title || "");

          const badge = document.createElement("span");
          badge.className = "pl-badge";
          badge.setAttribute("aria-hidden", "true");

          const number = document.createElement("span");
          number.className = "pl-num";
          number.textContent = String(index + 1).padStart(2, "0");

          const bars = document.createElement("span");
          bars.className = "pl-bars";
          bars.append(
            document.createElement("i"),
            document.createElement("i"),
            document.createElement("i")
          );
          badge.append(number, bars);

          const meta = document.createElement("span");
          meta.className = "pl-meta";

          const title = document.createElement("span");
          title.className = "pl-title";
          title.textContent = track.title || "Không rõ tên";
          meta.appendChild(title);

          if (track.artist) {
            const artist = document.createElement("span");
            artist.className = "pl-artist";
            artist.textContent = track.artist;
            meta.appendChild(artist);
          }

          button.append(badge, meta);
          item.appendChild(button);
          fragment.appendChild(item);
        });

        if (!MUSIC_LIBRARY.length) {
          const empty = document.createElement("li");
          empty.className = "pl-empty";
          empty.textContent = "Chưa có bài nào trong danh sách";
          fragment.appendChild(empty);
        }

        pl.list.replaceChildren(fragment);
        updateCounter();
        syncPlaylist();
      }

      function syncPlaylist() {
        if (!playlistReady) return;
        for (const button of pl.list.querySelectorAll(".pl-item")) {
          const index = Number(button.dataset.index);
          const current = index === state.index;
          button.classList.toggle("is-current", current);
          button.classList.toggle("is-failed", failedTracks.has(index));
          if (current) button.setAttribute("aria-current", "true");
          else button.removeAttribute("aria-current");
        }
      }

      function scrollToCurrent(smooth) {
        if (!playlistReady) return;
        const current = pl.list.querySelector(".pl-item.is-current");
        if (!current) return;
        const top = current.offsetTop - (pl.list.clientHeight - current.offsetHeight) / 2;
        pl.list.scrollTo({
          top: Math.max(0, top),
          behavior: smooth && !reduceMotion ? "smooth" : "auto"
        });
      }

      function onTrackChanged() {
        if (!playlistReady) return;
        syncPlaylist();
        if (pl.panel.classList.contains("is-open")) scrollToCurrent(true);
      }

      function setPlaylistOpen(open) {
        if (!playlistReady) return;
        pl.panel.classList.toggle("is-open", open);
        pl.panel.setAttribute("aria-hidden", String(!open));
        pl.button.setAttribute("aria-expanded", String(open));
        pl.button.setAttribute("aria-label", open ? "Đóng danh sách nhạc" : "Mở danh sách nhạc");
        pl.button.classList.toggle("is-active", open);
        if (open) {
          refreshR2Index();
          scrollToCurrent(false);
        } else if (pl.panel.contains(document.activeElement)) {
          pl.button.focus();
        }
      }

      let r2LoadedAt = 0;
      let r2Busy = false;
      const buildR2Url = (key) =>
        MUSIC_SETTINGS.r2Base + String(key).replace(/^\/+/, "").split("/").map(encodeURIComponent).join("/");

      function toR2Track(entry) {
        const raw = typeof entry === "string" ? { src: entry } : entry;
        if (!raw || typeof raw !== "object") return null;
        let src = String(raw.src || raw.url || "");
        if (!src && (raw.key || raw.name)) src = buildR2Url(raw.key || raw.name);
        else if (src && !/^(https?:)?\/\//i.test(src) && !src.startsWith("/")) src = buildR2Url(src);
        if (!src || !MUSIC_SETTINGS.audioExt.test(trackKey(src))) return null;
        return normalizeTrack({ src, title: raw.title, artist: raw.artist });
      }

      async function refreshR2Index(force = false) {
        if (!MUSIC_SETTINGS.r2IndexUrl || r2Busy) return;
        if (!force && r2LoadedAt && Date.now() - r2LoadedAt < MUSIC_SETTINGS.r2CacheMs) return;
        r2Busy = true;
        const controller = typeof AbortController === "function" ? new AbortController() : null;
        const timer = window.setTimeout(() => controller?.abort(), 8000);
        try {
          const response = await fetch(MUSIC_SETTINGS.r2IndexUrl, {
            cache: "no-cache",
            signal: controller?.signal
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const data = await response.json();
          const entries = Array.isArray(data) ? data : (data?.files || data?.tracks || data?.objects);
          if (!Array.isArray(entries)) throw new Error("Invalid R2 index");
          const known = new Set(MUSIC_LIBRARY.map((track) => trackKey(track.src)));
          const fresh = [];
          for (const entry of entries) {
            const track = toR2Track(entry);
            if (!track) continue;
            const key = trackKey(track.src);
            if (known.has(key)) continue;
            known.add(key);
            fresh.push(track);
          }
          fresh.sort((a, b) =>
            String(a.title).localeCompare(String(b.title), "vi", { numeric: true, sensitivity: "base" })
          );
          r2LoadedAt = Date.now();
          setNote("");
          if (fresh.length) {
            MUSIC_LIBRARY.push(...fresh);
            renderPlaylist();
            if (!audio.getAttribute("src")) loadTrack(0);
          }
        } catch (error) {
          console.warn("R2 index unavailable", error);
          setNote("Không tải được chỉ mục từ R2, đang hiển thị danh sách có sẵn.");
        } finally {
          clearTimeout(timer);
          r2Busy = false;
        }
      }

      if (playlistReady) {
        pl.button.addEventListener("click", () => setPlaylistOpen(!pl.panel.classList.contains("is-open")));
        pl.list.addEventListener("click", (event) => {
          const button = event.target?.closest?.(".pl-item");
          if (!button || !pl.list.contains(button)) return;
          const index = Number(button.dataset.index);
          if (!Number.isInteger(index) || index < 0 || index >= MUSIC_LIBRARY.length) return;
          if (index === state.index && !failedTracks.has(index)) {
            ui.play.click();
            return;
          }
          state.tried.clear();
          failedTracks.delete(index);
          loadTrack(index, true);
        });
        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape" && pl.panel.classList.contains("is-open")) {
            setPlaylistOpen(false);
            pl.button.focus();
          }
        });
        renderPlaylist();
      }

      if (MUSIC_LIBRARY.length) loadTrack(0);
      else showTrack(null);
      refreshR2Index();
    })();
  </script>
</body>
</html>
