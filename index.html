<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>spekco | Profile</title>


<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif;
}


html,
body {
    width: 100%;
    min-height: 100%;

    overflow-x: hidden;
}


body {
    min-height: 100vh;

    color: #fff;

    background:
        radial-gradient(
            circle at 50% -10%,
            #251034 0%,
            #10071b 45%,
            #08040e 100%
        );

    isolation: isolate;
}


/* =========================================================
   LIQUID BACKGROUND
========================================================= */

.liquid-bg {

    position: fixed;

    inset: 0;

    z-index: -3;

    overflow: hidden;

    pointer-events: none;

    filter: blur(35px);
}


.liquid-orb {

    position: absolute;

    width: 230px;
    height: 230px;

    border-radius: 50%;

    opacity: .45;

    filter: blur(15px);

    will-change: transform;

    animation:
        liquidMove 14s ease-in-out infinite alternate;
}


/* Pink */

.orb-1 {

    top: 5%;
    left: -70px;

    background:
        radial-gradient(
            circle,
            rgba(255,91,197,.65),
            rgba(255,91,197,0)
        );

    animation-duration: 17s;
}


/* Purple */

.orb-2 {

    top: 28%;
    right: -90px;

    background:
        radial-gradient(
            circle,
            rgba(133,91,255,.65),
            rgba(133,91,255,0)
        );

    animation-duration: 20s;

    animation-delay: -4s;
}


/* Blue */

.orb-3 {

    top: 58%;
    left: -100px;

    background:
        radial-gradient(
            circle,
            rgba(74,111,255,.45),
            rgba(74,111,255,0)
        );

    animation-duration: 22s;

    animation-delay: -7s;
}


/* Pink */

.orb-4 {

    bottom: -80px;
    right: -60px;

    background:
        radial-gradient(
            circle,
            rgba(255,80,180,.45),
            rgba(255,80,180,0)
        );

    animation-duration: 18s;

    animation-delay: -3s;
}


@keyframes liquidMove {

    0% {

        transform:
            translate3d(0,0,0)
            scale(1);
    }

    30% {

        transform:
            translate3d(55px,-35px,0)
            scale(1.12);
    }

    60% {

        transform:
            translate3d(-30px,60px,0)
            scale(.92);
    }

    100% {

        transform:
            translate3d(45px,20px,0)
            scale(1.08);
    }
}


/* =========================================================
   GLASS NOISE
========================================================= */

.glass-noise {

    position: fixed;

    inset: 0;

    z-index: -1;

    pointer-events: none;

    opacity: .025;

    background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
}


/* =========================================================
   LAYOUT
========================================================= */

.container {

    width:
        calc(100% - 24px);

    max-width: 390px;

    margin:
        20px auto;

    display: flex;

    flex-direction: column;

    gap: 14px;
}


/* =========================================================
   GLASS CARD
========================================================= */

.card {

    position: relative;

    overflow: hidden;

    padding: 18px;

    border-radius: 22px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.025)
        );

    border:
        1px solid rgba(255,255,255,.14);

    backdrop-filter:
        blur(24px)
        saturate(145%);

    -webkit-backdrop-filter:
        blur(24px)
        saturate(145%);

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.12),
        inset 0 -1px 0 rgba(255,255,255,.025),
        0 15px 45px rgba(0,0,0,.28);

    transition:
        transform .35s cubic-bezier(.2,.8,.2,1),
        border-color .35s ease,
        box-shadow .35s ease;
}


/* Glass reflection */

.card::before {

    content: "";

    position: absolute;

    top: -100%;
    left: -50%;

    width: 200%;
    height: 200%;

    pointer-events: none;

    background:
        linear-gradient(
            115deg,
            transparent 35%,
            rgba(255,255,255,.055) 45%,
            rgba(255,255,255,.11) 50%,
            rgba(255,255,255,.055) 55%,
            transparent 65%
        );

    transform:
        translateX(-60%)
        rotate(8deg);

    opacity: .45;

    animation:
        glassReflection 9s ease-in-out infinite;
}


@keyframes glassReflection {

    0%,
    100% {

        transform:
            translateX(-65%)
            rotate(8deg);
    }

    50% {

        transform:
            translateX(65%)
            rotate(8deg);
    }
}


/* Edge light */

.card::after {

    content: "";

    position: absolute;

    inset: 0;

    border-radius: inherit;

    pointer-events: none;

    background:
        radial-gradient(
            circle at
            var(--light-x,50%)
            var(--light-y,0%),
            rgba(255,255,255,.16),
            transparent 28%
        );

    opacity: .7;
}


/* =========================================================
   PROFILE
========================================================= */

.profile-card {

    text-align: center;

    padding-top: 22px;

    background:
        linear-gradient(
            135deg,
            rgba(255,150,220,.075),
            rgba(100,60,180,.035)
        );
}


.speech-bubble {

    display: inline-block;

    max-width: 100%;

    padding: 8px 12px;

    margin-bottom: 15px;

    border-radius: 14px;

    background:
        rgba(255,150,210,.13);

    border:
        1px solid rgba(255,180,220,.30);

    color: #ffe5f3;

    font-size: 12px;

    backdrop-filter:
        blur(15px)
        saturate(150%);

    -webkit-backdrop-filter:
        blur(15px)
        saturate(150%);

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.12),
        0 8px 25px rgba(0,0,0,.12);
}


/* =========================================================
   AVATAR
========================================================= */

.avatar-wrapper {

    position: relative;

    width: 92px;
    height: 92px;

    margin:
        0 auto 12px;

    padding: 3px;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            #ff9edc,
            #a66cff,
            #ff9edc
        );

    box-shadow:
        0 0 25px rgba(220,100,255,.65);

    animation:
        avatarFloat 5s ease-in-out infinite;
}


.avatar {

    width: 100%;
    height: 100%;

    display: block;

    border-radius: 50%;

    object-fit: cover;

    border:
        2px solid rgba(255,255,255,.8);
}


@keyframes avatarFloat {

    0%,
    100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-4px);
    }
}


.username {

    font-size: 22px;

    font-weight: 700;

    letter-spacing: 1px;
}


/* =========================================================
   ONLINE STATUS
========================================================= */

.status-badge {

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 7px;

    margin-top: 6px;

    color: #9cff68;

    font-size: 13px;

    transition: color .3s ease;
}


.status-dot {

    width: 9px;
    height: 9px;

    border-radius: 50%;

    background: #6cff3d;

    box-shadow:
        0 0 10px #6cff3d;

    animation:
        pulse 1.5s infinite;
}


@keyframes pulse {

    0%,
    100% {

        transform: scale(1);

        opacity: 1;
    }

    50% {

        transform: scale(1.35);

        opacity: .6;
    }
}


.status-badge.offline-text {

    color: #aaa;
}


.status-dot.offline {

    background: #888;

    box-shadow: none;

    animation: none;
}


/* =========================================================
   STATUS CARD
========================================================= */

.status-card {

    text-align: center;

    color: #e9dff5;

    font-size: 14px;

    font-style: italic;
}


/* =========================================================
   MUSIC PLAYER
========================================================= */

.music-card {

    text-align: center;

    padding:
        18px 18px 20px;

    background:
        linear-gradient(
            135deg,
            rgba(255,120,210,.065),
            rgba(130,90,255,.04)
        );
}


.music-header {

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 10px;

    margin-bottom: 5px;
}


.music-label {

    color: #e08ac2;

    font-size: 10px;

    font-weight: 600;

    letter-spacing: 2.5px;

    text-transform: uppercase;
}


.music-status {

    padding: 3px 7px;

    border-radius: 999px;

    color:
        rgba(255,255,255,.55);

    background:
        rgba(255,255,255,.055);

    border:
        1px solid rgba(255,255,255,.08);

    font-size: 8px;

    font-weight: 600;

    letter-spacing: .7px;

    transition: .3s;
}


.music-status.playing {

    color: #8aff72;

    background:
        rgba(100,255,80,.08);

    border-color:
        rgba(100,255,80,.16);
}


.music-status.error {

    color: #ff8cba;

    background:
        rgba(255,80,130,.08);

    border-color:
        rgba(255,80,130,.16);
}


/* Clock */

.clock {

    margin:
        4px 0 8px;

    color: #ff8ed4;

    font-size: 22px;

    font-weight: 600;

    letter-spacing: .3px;

    text-shadow:
        0 0 18px rgba(255,100,210,.25);
}


/* Song */

.song-info {

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 8px;

    width: 100%;

    margin-bottom: 16px;
}


.song-title {

    min-width: 0;

    max-width: 85%;

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;

    color: #f1eaf3;

    font-size: 14px;

    font-weight: 500;
}


.song-number {

    flex-shrink: 0;

    color:
        rgba(255,255,255,.35);

    font-size: 9px;
}


/* =========================================================
   PROGRESS
========================================================= */

.progress-container {

    width: 100%;
}


#progress {

    width: 100%;

    height: 5px;

    appearance: none;

    -webkit-appearance: none;

    border: 0;

    outline: none;

    border-radius: 999px;

    background:
        rgba(255,255,255,.13);

    cursor: pointer;
}


#progress::-webkit-slider-runnable-track {

    height: 5px;

    border-radius: 999px;

    background:
        var(--progress-bg,
        rgba(255,255,255,.13));
}


#progress::-webkit-slider-thumb {

    width: 14px;
    height: 14px;

    margin-top: -4.5px;

    appearance: none;

    -webkit-appearance: none;

    border: 0;

    border-radius: 50%;

    background: #ff8ed4;

    box-shadow:
        0 0 10px rgba(255,100,210,.8),
        0 0 20px rgba(255,100,210,.25);

    cursor: pointer;

    transition:
        transform .15s ease;
}


#progress::-webkit-slider-thumb:active {

    transform: scale(1.25);
}


#progress::-moz-range-track {

    height: 5px;

    border-radius: 999px;

    background:
        rgba(255,255,255,.13);
}


#progress::-moz-range-progress {

    height: 5px;

    border-radius: 999px;

    background:
        linear-gradient(
            90deg,
            #ff87d2,
            #9e6eff
        );
}


#progress::-moz-range-thumb {

    width: 14px;
    height: 14px;

    border: 0;

    border-radius: 50%;

    background: #ff8ed4;

    box-shadow:
        0 0 10px rgba(255,100,210,.8);

    cursor: pointer;
}


/* Time */

.time-row {

    display: flex;

    justify-content: space-between;

    margin-top: 7px;

    color:
        rgba(255,255,255,.42);

    font-size: 10px;
}


/* =========================================================
   MUSIC BUTTONS
========================================================= */

.controls {

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 20px;

    margin-top: 18px;
}


.music-button {

    position: relative;

    width: 46px;
    height: 46px;

    display: flex;

    justify-content: center;

    align-items: center;

    overflow: hidden;

    border:
        1px solid rgba(255,255,255,.12);

    border-radius: 50%;

    color: #fff;

    background:
        rgba(255,255,255,.065);

    backdrop-filter:
        blur(18px)
        saturate(150%);

    -webkit-backdrop-filter:
        blur(18px)
        saturate(150%);

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.12),
        inset 0 -1px 0 rgba(0,0,0,.12);

    font-size: 17px;

    cursor: pointer;

    transition:
        transform .18s ease,
        background .25s ease,
        box-shadow .25s ease;
}


.music-button::before {

    content: "";

    position: absolute;

    width: 70px;
    height: 70px;

    top: -48px;
    left: -48px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.18),
            transparent 65%
        );

    transition:
        transform .4s ease;
}


.music-button:hover {

    background:
        rgba(255,255,255,.11);
}


.music-button:hover::before {

    transform:
        translate3d(40px,40px,0);
}


.music-button:active {

    transform: scale(.88);
}


/* Main play */

.play-button {

    width: 58px;
    height: 58px;

    font-size: 20px;

    background:
        linear-gradient(
            135deg,
            rgba(255,130,205,.58),
            rgba(145,105,255,.58)
        );

    border:
        1px solid rgba(255,255,255,.2);

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.2),
        0 0 25px rgba(210,100,255,.28);
}


/* Playing glow */

.music-card.is-playing
.play-button {

    animation:
        musicGlow 2.2s ease-in-out infinite;
}


@keyframes musicGlow {

    0%,
    100% {

        box-shadow:
            inset 0 1px 0 rgba(255,255,255,.2),
            0 0 20px rgba(210,100,255,.22);
    }

    50% {

        box-shadow:
            inset 0 1px 0 rgba(255,255,255,.2),
            0 0 32px rgba(210,100,255,.45);
    }
}


/* =========================================================
   TECH STACK
========================================================= */

.tech-stack {

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 14px;

    flex-wrap: wrap;
}


.tech-icon {

    position: relative;

    width: 46px;
    height: 46px;

    display: flex;

    justify-content: center;

    align-items: center;

    overflow: hidden;

    border-radius: 12px;

    background:
        rgba(255,255,255,.08);

    border:
        1px solid rgba(255,255,255,.12);

    backdrop-filter:
        blur(15px)
        saturate(140%);

    -webkit-backdrop-filter:
        blur(15px)
        saturate(140%);

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.1);

    transition:
        transform .2s ease,
        background .2s ease;
}


.tech-icon:hover {

    transform:
        translateY(-2px);

    background:
        rgba(255,255,255,.15);
}


.tech-icon svg {

    width: 28px;
    height: 28px;
}


.tech-icon::before {

    content: "";

    position: absolute;

    width: 45px;
    height: 45px;

    top: -30px;
    left: -30px;

    border-radius: 50%;

    background:
        rgba(255,255,255,.08);

    transition:
        transform .35s ease;
}


.tech-icon:hover::before {

    transform:
        translate(35px,35px);
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 420px) {

    .container {

        width:
            calc(100% - 18px);

        margin:
            12px auto;
    }


    .card {

        padding: 15px;
    }


    .profile-card {

        padding-top: 20px;
    }


    .clock {

        font-size: 21px;
    }


    .controls {

        gap: 18px;
    }
}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {

        animation-duration:
            .01ms !important;

        animation-iteration-count:
            1 !important;

        transition-duration:
            .01ms !important;
    }
}

</style>

</head>


<body>


<!-- =========================================================
     LIQUID BACKGROUND
========================================================= -->

<div class="liquid-bg">

    <div class="liquid-orb orb-1"></div>

    <div class="liquid-orb orb-2"></div>

    <div class="liquid-orb orb-3"></div>

    <div class="liquid-orb orb-4"></div>

</div>


<div class="glass-noise"></div>


<!-- =========================================================
     MAIN
========================================================= -->

<main class="container">


    <!-- =====================================================
         PROFILE
    ====================================================== -->

    <section class="card profile-card">

        <div class="speech-bubble">
            i wanna be cute like u lemme feel your molecules
        </div>


        <div class="avatar-wrapper">

            <img
                src="avatar.jpg"
                alt="Avatar"
                class="avatar"
                onerror="this.style.display='none';"
            >

        </div>


        <h1 class="username">
            spekco
        </h1>


        <div
            class="status-badge"
            id="status-badge"
        >

            <span
                class="status-dot"
                id="status-dot"
            ></span>

            <span id="status-text">
                online
            </span>

        </div>

    </section>


    <!-- =====================================================
         STATUS
    ====================================================== -->

    <section class="card status-card">

        "I'm not currently doing anything!"

    </section>


    <!-- =====================================================
         MUSIC PLAYER
    ====================================================== -->

    <section class="card music-card">


        <div class="music-header">

            <span class="music-label">
                NOW PLAYING
            </span>

            <span
                class="music-status"
                id="music-status"
            >
                READY
            </span>

        </div>


        <div
            class="clock"
            id="clock"
        >
            00:00:00 AM
        </div>


        <div class="song-info">

            <div
                class="song-title"
                id="song-name"
            >
                Loading...
            </div>

            <div
                class="song-number"
                id="song-number"
            >
                1 / 1
            </div>

        </div>


        <div class="progress-container">

            <input
                id="progress"
                type="range"
                min="0"
                max="100"
                value="0"
                step="0.01"
                aria-label="Music progress"
            >


            <div class="time-row">

                <span id="current-time">
                    0:00
