<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>spekco | Profile</title>

<!-- Google Font chuyên nghiệp -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

/* =========================
   GLOBAL RESET & VARIABLES
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    -webkit-tap-highlight-color: transparent;
}

html {
    height: 100%;
}

body {
    min-height: 100vh;
    width: 100%;
    overflow-x: hidden;
    color: #ffffff;
    background-color: #0b0314;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* =========================
   BACKGROUND AMBIENT GLOW (NỀN ĐÈN NEON NHẸ)
========================= */

.bg-glow-1, .bg-glow-2 {
    position: fixed;
    width: 280px;
    height: 280px;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.45;
    z-index: 0;
    pointer-events: none;
    animation: floatBg 12s infinite alternate ease-in-out;
}

.bg-glow-1 {
    top: 10%;
    left: 50%;
    transform: translateX(-120%);
    background: radial-gradient(circle, #ff60c5, #a66cff);
}

.bg-glow-2 {
    bottom: 10%;
    left: 50%;
    transform: translateX(20%);
    background: radial-gradient(circle, #6cff3d, #4facfe);
    animation-delay: -6s;
}

@keyframes floatBg {
    0% { transform: translate(-10%, -10%) scale(1); }
    100% { transform: translate(10%, 10%) scale(1.15); }
}

/* =========================
   MAIN CONTAINER & CARDS
========================= */

.container {
    width: calc(100% - 24px);
    max-width: 390px;
    margin: 24px auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
    position: relative;
    z-index: 1;
}

.card {
    width: 100%;
    padding: 20px;
    border-radius: 24px;
    background: rgba(23, 12, 38, 0.45);
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow:
        0 12px 40px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
}

/* Delay hiệu ứng xuát hiện cho từng card */
.container > div:nth-child(1) { animation-delay: 0.1s; }
.container > div:nth-child(2) { animation-delay: 0.2s; }
.container > div:nth-child(3) { animation-delay: 0.3s; }
.container > div:nth-child(4) { animation-delay: 0.4s; }

.card:hover {
    border-color: rgba(255, 180, 220, 0.3);
    box-shadow: 
        0 16px 45px rgba(0, 0, 0, 0.5),
        0 0 20px rgba(255, 150, 210, 0.1);
}

@keyframes slideUpFade {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* =========================
   PROFILE SECTION
========================= */

.profile-card {
    text-align: center;
    padding-top: 24px;
}

.speech-bubble {
    display: inline-block;
    max-width: 100%;
    padding: 8px 14px;
    margin-bottom: 18px;
    border-radius: 16px;
    background: rgba(255, 150, 210, 0.12);
    border: 1px solid rgba(255, 180, 220, 0.25);
    color: #ffe5f3;
    font-size: 12px;
    font-weight: 500;
    box-shadow: 0 4px 15px rgba(255, 100, 200, 0.1);
    animation: floatBubble 4s ease-in-out infinite;
}

@keyframes floatBubble {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
}

/* AVATAR */

.avatar-wrapper {
    width: 96px;
    height: 96px;
    margin: 0 auto 14px;
    padding: 3px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff9edc, #a66cff, #6cff3d);
    background-size: 200% 200%;
    box-shadow: 0 0 25px rgba(220, 100, 255, 0.5);
    animation: gradientRotate 6s ease infinite;
}

@keyframes gradientRotate {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.avatar {
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid rgba(15, 5, 29, 0.8);
    transition: transform 0.3s ease;
}

.avatar-wrapper:hover .avatar {
    transform: scale(1.04);
}

.username {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.5px;
    background: linear-gradient(180deg, #ffffff 0%, #e2d2f7 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

/* STATUS BADGE */

.status-badge {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
    color: #8eff5c;
    font-size: 13px;
    font-weight: 500;
    transition: color 0.3s ease;
}

.status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #6cff3d;
    box-shadow: 0 0 12px #6cff3d;
    animation: pulse 2s infinite ease-in-out;
}

.status-badge.offline-text { color: #aaaaaa; }
.status-dot.offline {
    background: #888888;
    box-shadow: none;
    animation: none;
}

@keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.4); opacity: 0.5; }
}

/* =========================
   STATUS CARD
========================= */

.status-card {
    text-align: center;
    color: #dfd5ed;
    font-size: 13.5px;
    font-style: italic;
    line-height: 1.4;
}

/* =========================
   MUSIC PLAYER
========================= */

.music-card { text-align: center; }

.music-header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 8px;
}

.music-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #ff9bd8;
}

/* CSS WAVEFORM VISUALIZER */

.equalizer {
    display: none;
    align-items: flex-end;
    gap: 2px;
    height: 12px;
}

.equalizer.active { display: flex; }

.bar {
    width: 2px;
    background-color: #ff9bd8;
    border-radius: 2px;
    animation: bounce 0.8s ease infinite alternate;
}

.bar:nth-child(1) { height: 40%; animation-delay: 0.1s; }
.bar:nth-child(2) { height: 100%; animation-delay: 0.3s; }
.bar:nth-child(3) { height: 60%; animation-delay: 0.2s; }

@keyframes bounce {
    100% { height: 10%; }
}

.clock {
    font-size: 26px;
    font-weight: 700;
    color: #ff8fd2;
    letter-spacing: 1px;
    margin-bottom: 6px;
    text-shadow: 0 0 15px rgba(255, 143, 210, 0.3);
}

.song-title {
    font-size: 13.5px;
    font-weight: 500;
    color: #ffffff;
    margin-bottom: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding: 0 8px;
}

/* PROGRESS BAR */

.progress-container {
    width: 100%;
    margin-bottom: 6px;
}

#progress {
    width: 100%;
    height: 5px;
    appearance: none;
    -webkit-appearance: none;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.15);
    outline: none;
    cursor: pointer;
    transition: height 0.2s ease;
}

#progress:hover { height: 7px; }

#progress::-webkit-slider-thumb {
    appearance: none;
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #ff8fd2;
    box-shadow: 0 0 12px rgba(255, 100, 210, 0.9);
    transition: transform 0.2s ease;
}

#progress::-webkit-slider-thumb:hover {
    transform: scale(1.2);
}

.time-row {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    font-weight: 500;
    color: #a79cb5;
    margin-top: 6px;
}

/* MUSIC BUTTONS */

.controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 18px;
    margin-top: 14px;
}

.music-button {
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.12);
    font-size: 16px;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

.music-button:hover {
    background: rgba(255, 255, 255, 0.18);
    transform: scale(1.06);
}

.music-button:active {
    transform: scale(0.92);
}

.play-button {
    width: 56px;
    height: 56px;
    font-size: 20px;
    background: linear-gradient(135deg, rgba(255, 120, 200, 0.8), rgba(150, 100, 255, 0.8));
    border: 1px solid rgba(255, 255, 255, 0.3);
    box-shadow: 0 0 25px rgba(220, 100, 255, 0.4);
}

.play-button:hover {
    box-shadow: 0 0 30px rgba(220, 100, 255, 0.6);
    transform: scale(1.08);
}

.play-button.playing {
    animation: glowPulse 2s infinite ease-in-out;
}

@keyframes glowPulse {
    0%, 100% { box-shadow: 0 0 20px rgba(220, 100, 255, 0.4); }
    50% { box-shadow: 0 0 35px rgba(220, 100, 255, 0.8); }
}

/* =========================
   TECH STACK LOGOS
========================= */

.tech-card {
    padding: 16px 20px 20px;
}

.tech-title {
    text-align: center;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #ff9bd8;
    margin-bottom: 14px;
}

.tech-stack {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
}

.tech-icon {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.1);
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    cursor: pointer;
}

.tech-icon svg {
    width: 26px;
    height: 26px;
    display: block;
    transition: transform 0.3s ease;
}

/* Hiệu ứng Glow tùy chỉnh theo chuẩn màu Thương Hiệu của từng Icon */
.tech-icon[title="JavaScript"]:hover {
    background: rgba(247, 223, 30, 0.15);
    border-color: rgba(247, 223, 30, 0.5);
    box-shadow: 0 8px 20px rgba(247, 223, 30, 0.3);
    transform: translateY(-4px) scale(1.05);
}

.tech-icon[title="HTML5"]:hover {
    background: rgba(228, 77, 38, 0.15);
    border-color: rgba(228, 77, 38, 0.5);
    box-shadow: 0 8px 20px rgba(228, 77, 38, 0.3);
    transform: translateY(-4px) scale(1.05);
}

.tech-icon[title="Python"]:hover {
    background: rgba(56, 126, 184, 0.15);
    border-color: rgba(56, 126, 184, 0.5);
    box-shadow: 0 8px 20px rgba(56, 126, 184, 0.3);
    transform: translateY(-4px) scale(1.05);
}

.tech-icon[title="Node.js"]:hover {
    background: rgba(83, 158, 67, 0.15);
    border-color: rgba(83, 158, 67, 0.5);
    box-shadow: 0 8px 20px rgba(83, 158, 67, 0.3);
    transform: translateY(-4px) scale(1.05);
}

.tech-icon:hover svg {
    transform: scale(1.1);
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 420px) {
    .container {
        width: calc(100% - 20px);
        margin: 16px auto;
    }

    .card {
        padding: 16px;
        border-radius: 20px;
    }

    .clock {
        font-size: 24px;
    }
}

</style>
</head>

<script>

/* ==========================================
   KỂM TRA VÀ CẬP NHẬT TRẠNG THÁI ONLINE / OFFLINE
========================================== */

function updateOnlineStatus() {
    const statusDot = document.getElementById("status-dot");
    const statusText = document.getElementById("status-text");
    const statusBadge = document.getElementById("status-badge");

    if (navigator.onLine) {
        statusText.textContent = "online";
        statusDot.classList.remove("offline");
        statusBadge.classList.remove("offline-text");
    } else {
        statusText.textContent = "offline";
        statusDot.classList.add("offline");
        statusBadge.classList.add("offline-text");
    }
}

window.addEventListener("online", updateOnlineStatus);
window.addEventListener("offline", updateOnlineStatus);
updateOnlineStatus();

/* ==========================================
   CLOCK (ĐỒNG HỒ)
========================================== */

function updateClock() {
    const now = new Date();
    let hours = now.getHours();
    const minutes = String(now.getMinutes()).padStart(2, "0");
    const seconds = String(now.getSeconds()).padStart(2, "0");
    const ampm = hours >= 12 ? "PM" : "AM";

    hours = hours % 12 || 12;
    hours = String(hours).padStart(2, "0");

    document.getElementById("clock").textContent = `${hours}:${minutes}:${seconds} ${ampm}`;
}

updateClock();
setInterval(updateClock, 1000);

/* ==========================================
   MUSIC PLAYER
========================================== */

const songs = [
    "Tien Tien - My Everything.flac",
    "bob$ - Ít Bạn Ít Nạn.flac"
];

let currentSong = 0;

const audio = document.getElementById("audio-player");
const playButton = document.getElementById("play-button");
const prevButton = document.getElementById("prev-button");
const nextButton = document.getElementById("next-button");
const songName = document.getElementById("song-name");
const progress = document.getElementById("progress");
const currentTimeText = document.getElementById("current-time");
const durationText = document.getElementById("duration");
const equalizer = document.getElementById("equalizer");

function loadSong(index) {
    currentSong = index;
    const songFile = songs[currentSong];
    audio.src = songFile;

    const displayName = songFile.split('/').pop().replace(/\.[^/.]+$/, "");
    songName.textContent = displayName;

    audio.load();
    progress.value = 0;
    currentTimeText.textContent = "0:00";
    durationText.textContent = "0:00";
}

function playSong() {
