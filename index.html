      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>spekco | Profile</title>

<!-- Import Google Font Inter & FontAwesome Icons -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-tap-highlight-color: transparent;
}

html {
    height: 100%;
}

/* =========================
   BODY & BACKGROUND FIX
========================= */

body {
    min-height: 100vh;
    width: 100%;
    overflow-x: hidden;
    color: #f3f4f6;
    background-color: #0b0514;
    background-image: 
        radial-gradient(at 10% 10%, rgba(236, 72, 153, 0.15) 0px, transparent 50%),
        radial-gradient(at 90% 20%, rgba(147, 51, 234, 0.2) 0px, transparent 50%),
        radial-gradient(at 50% 80%, rgba(79, 70, 229, 0.18) 0px, transparent 50%);
    background-attachment: fixed;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* =========================
   MAIN
========================= */

.container {
    width: calc(100% - 28px);
    max-width: 400px;
    margin: 24px auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
    position: relative;
    z-index: 1;
}

/* =========================
   GLASS CARD
========================= */

.card {
    width: 100%;
    padding: 22px;
    border-radius: 24px;
    background: rgba(22, 14, 38, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow:
        0 20px 40px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.3s ease, box-shadow 0.3s ease;
}

.card:hover {
    border-color: rgba(255, 158, 220, 0.3);
    box-shadow:
        0 22px 45px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.25),
        0 0 20px rgba(236, 72, 153, 0.15);
}

/* =========================
   PROFILE
========================= */

.profile-card {
    text-align: center;
    padding-top: 26px;
    position: relative;
    overflow: hidden;
}

.profile-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 60%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(236, 72, 153, 0.8), transparent);
}

.speech-bubble {
    display: inline-block;
    max-width: 100%;
    padding: 8px 14px;
    margin-bottom: 18px;
    border-radius: 20px;
    background: rgba(236, 72, 153, 0.12);
    border: 1px solid rgba(247, 114, 184, 0.3);
    color: #fbcfe8;
    font-size: 12.5px;
    font-weight: 500;
    line-height: 1.4;
    letter-spacing: 0.2px;
    box-shadow: 0 4px 12px rgba(236, 72, 153, 0.1);
}

/* =========================
   AVATAR
========================= */

.avatar-wrapper {
    width: 96px;
    height: 96px;
    margin: 0 auto 14px;
    padding: 3px;
    border-radius: 50%;
    background: linear-gradient(135deg, #f472b6, #a855f7, #3b82f6);
    box-shadow: 0 0 25px rgba(236, 72, 153, 0.45);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.avatar-wrapper:hover {
    transform: scale(1.04) rotate(2deg);
    box-shadow: 0 0 35px rgba(236, 72, 153, 0.7);
}

.avatar {
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid rgba(255, 255, 255, 0.9);
}

/* =========================
   USERNAME
========================= */

.username {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: 0.5px;
    background: linear-gradient(135deg, #ffffff 30%, #f472b6 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 2px;
}

/* =========================
   STATUS
========================= */

.status-badge {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin-top: 6px;
    padding: 4px 12px;
    border-radius: 20px;
    background: rgba(34, 197, 94, 0.1);
    border: 1px solid rgba(34, 197, 94, 0.2);
    color: #4ade80;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.5px;
    transition: all 0.3s ease;
}

.status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #4ade80;
    box-shadow: 0 0 10px #4ade80;
    animation: pulse 1.8s infinite cubic-bezier(0.4, 0, 0.6, 1);
    transition: background 0.3s ease, box-shadow 0.3s ease;
}

/* Style khi Offline */
.status-badge.offline-text {
    color: #9ca3af;
    background: rgba(156, 163, 175, 0.1);
    border-color: rgba(156, 163, 175, 0.2);
}

.status-dot.offline {
    background: #6b7280;
    box-shadow: none;
    animation: none;
}

@keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.3); opacity: 0.5; }
}

/* =========================
   STATUS CARD
========================= */

.status-card {
    text-align: center;
    color: #e2e8f0;
    font-size: 13.5px;
    font-style: italic;
    font-weight: 400;
    line-height: 1.5;
    background: rgba(15, 10, 28, 0.4);
}

/* =========================
   MUSIC
========================= */

.music-card {
    text-align: center;
}

.music-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2.5px;
    color: #f472b6;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
}

.music-label::before, .music-label::after {
    content: '';
    height: 1px;
    width: 16px;
    background: rgba(244, 114, 182, 0.4);
}

.clock {
    font-size: 26px;
    font-weight: 800;
    color: #ffffff;
    letter-spacing: 1.5px;
    margin-bottom: 6px;
    text-shadow: 0 0 20px rgba(244, 114, 182, 0.4);
}

.song-title {
    font-size: 13.5px;
    font-weight: 500;
    color: #cbd5e1;
    margin-bottom: 16px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding: 0 10px;
}

/* =========================
   PROGRESS BAR
========================= */

.progress-container {
    width: 100%;
    margin-bottom: 6px;
}

#progress {
    width: 100%;
    height: 6px;
    appearance: none;
    -webkit-appearance: none;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.12);
    outline: none;
    cursor: pointer;
    transition: background 0.2s;
}

#progress::-webkit-slider-thumb {
    appearance: none;
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #ffffff;
    box-shadow: 0 0 12px rgba(244, 114, 182, 1);
    transition: transform 0.1s ease;
}

#progress::-webkit-slider-thumb:hover {
    transform: scale(1.25);
}

.time-row {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    font-weight: 600;
    color: #94a3b8;
    margin-top: 6px;
}

/* =========================
   MUSIC BUTTONS
========================= */

.controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 16px;
    margin-top: 16px;
}

.music-button {
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #f1f5f9;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    font-size: 15px;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

.music-button:hover {
    background: rgba(255, 255, 255, 0.15);
    transform: translateY(-2px);
    color: #ffffff;
}

.music-button:active {
    transform: scale(0.92);
}

.play-button {
    width: 54px;
    height: 54px;
    font-size: 18px;
    background: linear-gradient(135deg, #ec4899, #8b5cf6);
    border: none;
    box-shadow: 0 6px 20px rgba(236, 72, 153, 0.4);
    color: #ffffff;
}

.play-button:hover {
    background: linear-gradient(135deg, #f472b6, #a855f7);
    box-shadow: 0 8px 25px rgba(236, 72, 153, 0.6);
    transform: translateY(-2px) scale(1.02);
}

/* =========================
   TECH STACK LOGOS
========================= */

.tech-title {
    text-align: center;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #ff9bd8;
    margin-bottom: 12px;
}

.tech-stack {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
}

.tech-icon {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    cursor: pointer;
}

.tech-icon:hover {
    transform: translateY(-4px) scale(1.08);
    background: rgba(255, 255, 255, 0.12);
    border-color: rgba(255, 255, 255, 0.3);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
}

.tech-icon svg {
    width: 26px;
    height: 26px;
    display: block;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
}

/* =========================
   MOBILE
========================= */

@media (max-width: 420px) {
    .container {
        width: calc(100% - 20px);
        margin: 16px auto;
    }

    .card {
        padding: 18px;
    }

    .clock {
        font-size: 22px;
    }
}

</style>
</head>

<script>

/* ==========================================
   TỰ ĐỘNG CẬP NHẬT TRẠNG THÁI ONLINE / OFFLINE
========================================== */

function updateOnlineStatus() {
    const statusDot = document.getElementById("status-dot");
    const statusText = document.getElementById("status-text");
    const statusBadge = document.getElementById("status-badge");

    if (navigator.onLine) {
        statusText.textContent = "online";
        statusDot.classList.remove("offline");
        statusBadge.classList.remove("offline-text");
    } else {
        statusText.textContent = "offline";
        statusDot.classList.add("offline");
        statusBadge.classList.add("offline-text");
    }
}

window.addEventListener("online", updateOnlineStatus);
window.addEventListener("offline", updateOnlineStatus);
updateOnlineStatus();

/* ==========================================
   CLOCK
========================================== */

function updateClock() {
    const now = new Date();
    let hours = now.getHours();
    const minutes = String(now.getMinutes()).padStart(2, "0");
    const seconds = String(now.getSeconds()).padStart(2, "0");
    const ampm = hours >= 12 ? "PM" : "AM";

    hours = hours % 12 || 12;
    hours = String(hours).padStart(2, "0");

    document.getElementById("clock").textContent = `${hours}:${minutes}:${seconds} ${ampm}`;
}

updateClock();
setInterval(updateClock, 1000);

/* ==========================================
   MUSIC PLAYER (HỖ TRỢ FILE .FLAC)
========================================== */

// Danh sách các file nhạc FLAC của bạn trên GitHub
const songs = [
    "music1.flac",
    "music2.flac"
];

let currentSong = 0;

const audio = document.getElementById("audio-player");
const playButton = document.getElementById("play-button");
const prevButton = document.getElementById("prev-button");
const nextButton = document.getElementById("next-button");
const songName = document.getElementById("song-name");
const progress = document.getElementById("progress");
const currentTimeText = document.getElementById("current-time");
const durationText = document.getElementById("duration");

function loadSong(index) {
    currentSong = index;
    const songFile = songs[currentSong];
    audio.src = songFile;

    // Tự động loại bỏ phần mở rộng dạng tập tin (.flac, .mp3, v.v.) để lấy tên bài hát sạch
    const displayName = songFile.split('/').pop().replace(/\.[^/.]+$/, "");
    songName.textContent = displayName;

    audio.load();
    progress.value = 0;
    currentTimeText.textContent = "0:00";
    durationText.textContent = "0:00";
}

function playSong() {
    audio.play().then(() => {
        playButton.innerHTML = '<i class="fa-solid fa-pause"></i>';
    }).catch(error => {
        console.log("Không thể tự động phát nhạc do chính sách trình duyệt:", error);
    });
}

function pauseSong() {
    audio.pause();
    playButton.innerHTML = '<i class="fa-solid fa-play"></i>';
}

playButton.addEventListener("click", function() {
    if (audio.paused) {
        playSong();
    } else {
        pauseSong();
    }
});

nextButton.addEventListener("click", function() {
    currentSong++;
    if (currentSong >= songs.length) {
        currentSong = 0;
    }
    loadSong(currentSong);
    playSong();
});

prevButton.addEventListener("click", function() {
    if (audio.currentTime > 3) {
        audio.currentTime = 0;
        return;
    }
    currentSong--;
    if (currentSong < 0) {
        currentSong = songs.length - 1;
    }
    loadSong(currentSong);
    playSong();
});

audio.addEventListener("ended", function() {
    currentSong++;
    if (currentSong >= songs.length) {
        currentSong = 0;
    }
    loadSong(currentSong);
    playSong();
});

audio.addEventListener("timeupdate", function() {
    if (!audio.duration) return;
    const percent = (audio.currentTime / audio.duration) * 100;
    progress.value = percent;
    currentTimeText.textContent = formatTime(audio.currentTime);
});

audio.addEventListener("loadedmetadata", function() {
    durationText.textContent = formatTime(audio.duration);
});

progress.addEventListener("input", function() {
    if (!audio.duration) return;
    audio.currentTime = (progress.value / 100) * audio.duration;
});

function formatTime(seconds) {
    if (!seconds || isNaN(seconds)) return "0:00";
    const minutes = Math.floor(seconds / 60
