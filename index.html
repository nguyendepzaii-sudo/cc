<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0e0520">
    <meta name="color-scheme" content="dark">
    <title>spekco | Profile</title>

    <!-- Font: Fredoka (tên, đồng hồ) + Be Vietnam Pro (nội dung, hỗ trợ đầy đủ dấu tiếng Việt) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Fredoka:wght@400;500;600&display=swap">

    <!-- File CSS riêng -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

        <!-- PROFILE -->
        <section class="card profile-card">
            <p class="speech-bubble">
                💤💤
            </p>

            <!-- Nếu không có avatar.jpg, tự hiện chữ cái đầu thay thế -->
            <div class="avatar-wrapper">
                <img
                    src="avatar.jpg"
                    alt="spekco's avatar"
                    class="avatar"
                    width="92"
                    height="92"
                    decoding="async"
                    onerror="this.parentElement.classList.add('no-image')">
                <span class="avatar-initial" aria-hidden="true">s</span>
            </div>

            <h1 class="username">spekco</h1>

            <!-- Đổi sang offline: thêm class "offline-text" vào status-badge,
                 thêm class "offline" vào status-dot và đổi chữ thành "offline" -->
            <div class="status-badge" id="status-badge">
                <span class="status-dot" id="status-dot" aria-hidden="true"></span>
                <span id="status-text">online</span>
            </div>
        </section>

        <!-- STATUS -->
        <section class="card status-card">
            <p>“gg”</p>
        </section>

        <!-- MUSIC PLAYER -->
        <section class="card music-card" aria-label="Music player">
            <div class="music-head">
                <div class="music-label">
                    <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
                    now playing
                </div>
                <span class="clock" id="clock">--:--:--</span>
            </div>

            <div class="track">
                <div class="song-title" id="song-name">Loading…</div>
                <div class="song-artist" id="song-artist"></div>
            </div>

            <div class="progress-container">
                <input
                    id="progress"
                    type="range"
                    min="0"
                    max="100"
                    value="0"
                    step="any"
                    aria-label="Seek"
                    disabled>

                <div class="time-row">
                    <span id="current-time">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>

            <div class="controls">
                <button class="music-button" id="prev-button" type="button" aria-label="Previous track">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M6 5.5h2v13H6z"/>
                        <path d="M19 6v12l-9.5-6z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                    </svg>
                </button>

                <button class="music-button play-button" id="play-button" type="button" aria-label="Play">
                    <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M8 5.5v13l11-6.5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                    </svg>
                    <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <rect x="6.5" y="5" width="4" height="14" rx="1.3"/>
                        <rect x="13.5" y="5" width="4" height="14" rx="1.3"/>
                    </svg>
                </button>

                <button class="music-button" id="next-button" type="button" aria-label="Next track">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M16 5.5h2v13h-2z"/>
                        <path d="M5 6v12l9.5-6z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>

            <audio id="audio-player" preload="metadata"></audio>
        </section>

        <!-- TECH STACK -->
        <section class="card tech-card" aria-label="Tech stack">
            <ul class="tech-stack">

                <!-- JavaScript -->
                <li class="tech-icon" title="JavaScript">
                    <svg viewBox="0 0 128 128" role="img" aria-label="JavaScript">
                        <rect width="128" height="128" rx="14" fill="#F7DF1E"/>
                        <text x="117" y="113" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" letter-spacing="-3" fill="#323330">JS</text>
                    </svg>
                </li>

                <!-- HTML5 -->
                <li class="tech-icon" title="HTML5">
                    <svg viewBox="0 0 128 128" role="img" aria-label="HTML5">
                        <path fill="#E44D26" d="M18.8 11.2l9.1 102.2 36.1 10 36.1-10 9.1-102.2H18.8z"/>
                        <path fill="#F16529" d="M64 121.2l30.2-8.4 7.8-87.3H64v95.7z"/>
                        <path fill="#EBEBEB" d="M64 54.1H48.4l-1.1-12.3H64V29.5H33.5l3.4 37H64v-12.4zm0 33.6l-13.7-3.7-.9-9.8H36.9l1.7 19.5 25.4 7V87.7z"/>
                        <path fill="#FFFFFF" d="M64 54.1v12.4h14.5l-1.4 15.3-13.1 3.5v12.2l25.3-7 2.5-28.1c.2-2.1.2-3.8.2-5.9l.1-2.4H64zm0-24.6v12.3h31.8l1.1-12.3H64z"/>
                    </svg>
                </li>

                <!-- Python -->
                <li class="tech-icon" title="Python">
                    <svg viewBox="0 0 128 128" role="img" aria-label="Python">
                        <linearGradient id="py-a" x1="13.2" y1="12.5" x2="68.2" y2="70.2" gradientUnits="userSpaceOnUse">
                            <stop offset="0" stop-color="#387EB8"/>
                            <stop offset="1" stop-color="#366994"/>
                        </linearGradient>
                        <linearGradient id="py-b" x1="59.8" y1="58.2" x2="114.8" y2="115.8" gradientUnits="userSpaceOnUse">
                            <stop offset="0" stop-color="#FFE052"/>
                            <stop offset="1" stop-color="#FFC321"/>
                        </linearGradient>
                        <path fill="url(#py-a)" d="M63.1 11c-28.6 0-26.9 12.4-26.9 12.4l.1 12.8h27.4v3.9H25.3S11 38.5 11 67.4c0 28.9 12.5 27.8 12.5 27.8h7.5V82.8s-.4-14.8 14.5-14.8h25.1s13.8.2 13.8-13.3V25.2S86.2 11 63.1 11zm-14.7 9.1c2.7 0 4.9 2.2 4.9 4.9s-2.2 4.9-4.9 4.9-4.9-2.2-4.9-4.9 2.2-4.9 4.9-4.9z"/>
                        <path fill="url(#py-b)" d="M64.9 117c28.6 0 26.9-12.4 26.9-12.4l-.1-12.8H64.3v-3.9h38.4s14.3 1.6 14.3-27.3c0-28.9-12.5-27.8-12.5-27.8h-7.5v12.4s.4 14.8-14.5 14.8H67.4s-13.8-.2-13.8 13.3v29.5s-1.8 14.2 21.3 14.2zm14.7-9.1c-2.7 0-4.9-2.2-4.9-4.9s2.2-4.9 4.9-4.9 4.9 2.2 4.9 4.9-2.2 4.9-4.9 4.9z"/>
                    </svg>
                </li>

                <!-- Node.js -->
                <li class="tech-icon" title="Node.js">
                    <svg viewBox="0 0 128 128" role="img" aria-label="Node.js">
                        <path d="M64 13l45 26v50l-45 26-45-26V39z" fill="#5FA04E" stroke="#5FA04E" stroke-width="8" stroke-linejoin="round"/>
                        <text x="64" y="79" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#FFFFFF">JS</text>
                    </svg>
                </li>

            </ul>
        </section>

    </main>

    <!-- File JavaScript riêng -->
    <script src="music.js"></script>
</body>
</html>
