<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>spekco | Profile</title>
    
    <!-- Link file CSS riêng -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <!-- PROFILE -->
        <div class="card profile-card">
            <div class="speech-bubble">
                i wanna be cute like u lemme feel your molecules
            </div>

            <div class="avatar-wrapper">
                <img
                    src="avatar.jpg"
                    alt="Avatar"
                    class="avatar"
                    onerror="this.style.display='none';">
            </div>

            <div class="username">
                spekco
            </div>

            <div class="status-badge" id="status-badge">
                <span class="status-dot" id="status-dot"></span>
                <span id="status-text">online</span>
            </div>
        </div>

        <!-- STATUS -->
        <div class="card status-card">
            "I'm not currently doing anything!"
        </div>

        <!-- MUSIC PLAYER -->
        <div class="card music-card">
            <div class="music-label">
                NOW PLAYING
            </div>

            <div class="clock" id="clock">
                00:00:00 AM
            </div>

            <div class="song-title" id="song-name">
                Loading...
            </div>

            <div class="progress-container">
                <input
                    id="progress"
                    type="range"
                    min="0"
                    max="100"
                    value="0"
                    step="0.1">

                <div class="time-row">
                    <span id="current-time">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>

            <div class="controls">
                <button class="music-button" id="prev-button" type="button">⏮</button>
                <button class="music-button play-button" id="play-button" type="button">▶</button>
                <button class="music-button" id="next-button" type="button">⏭</button>
            </div>

            <audio id="audio-player" preload="metadata"></audio>
        </div>

        <!-- TECH STACK -->
        <div class="card">
            <div class="tech-stack">
                <!-- JavaScript Logo -->

                    </svg>
                </div>

                <!-- HTML5 Logo -->

                        <path fill="#E44D26" d="M18.8 11.2l9.1 102.2 36.1 10 36.1-10 9.1-102.2H18.8z"/>
                        <path fill="#F16529" d="M64 121.2l30.2-8.4 7.8-87.3H64v95.7z"/>

                </div>

                <!-- Python Logo -->

    </div>
