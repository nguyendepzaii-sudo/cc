<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#030405">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Profile cá nhân của spekco — now playing.">
  <meta property="og:type" content="profile">
  <meta property="og:title" content="spekco | Profile">
  <meta property="og:description" content="Một góc nhỏ của spekco — đang nghe nhạc và chill.">
  <meta property="og:image" content="avatar.jpg">
  <meta property="og:url" content="https://spekco.xyz/">
  <meta property="og:site_name" content="spekco.xyz">
  <title>spekco | Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Fredoka:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css?v=20260930b">
</head>
<body>
  <canvas id="starfield" aria-hidden="true"></canvas>
  <div class="nebula nebula-one" aria-hidden="true"></div>
  <div class="nebula nebula-two" aria-hidden="true"></div>
  <main class="container">
    <section class="card profile-card">
      <span class="orbit orbit-one" aria-hidden="true"></span>
      <span class="orbit orbit-two" aria-hidden="true"></span>
      <p class="speech-bubble" id="status-emoji" aria-hidden="true"></p>
      <div class="avatar-wrapper">
        <img src="avatar.jpg" alt="" class="avatar" width="96" height="96" decoding="async">
        <span class="avatar-initial" aria-hidden="true"></span>
      </div>
      <h1 class="username" id="profile-name"></h1>
    </section>
    <section class="card status-card"><p id="quote" aria-label="Quote"></p></section>
    <section class="card music-card" aria-label="Music player">
      <div class="music-head">
        <div class="music-label"><span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span id="music-label">now playing</span></div>
        <span class="clock" id="clock">--:--:--</span>
      </div>
      <div class="track"><div class="song-title" id="song-name">Loading music…</div><div class="song-artist" id="song-artist"></div></div>
      <div class="progress-container">
        <input id="progress" type="range" min="0" max="100" value="0" step="any" aria-label="Seek" disabled>
        <div class="time-row"><span id="current-time">0:00</span><span id="duration">0:00</span></div>
      </div>
      <div class="controls">
        <button class="music-button" id="prev-button" type="button" aria-label="Previous track"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5.5h2v13H6zM18 5.5 9 12l9 6.5z"></path></svg></button>
        <button class="music-button play-button" id="play-button" type="button" aria-label="Play"><svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10-6.5z"></path></svg><svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3v14H7zM14 5h3v14h-3z"></path></svg></button>
        <button class="music-button" id="next-button" type="button" aria-label="Next track"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5.5h2v13h-2zM6 5.5 15 12l-9 6.5z"></path></svg></button>
        <button class="music-button" id="playlist-button" type="button" aria-label="Mở danh sách nhạc" aria-expanded="false" aria-controls="playlist-panel">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5h12v2H4zm0 5h12v2H4zm0 5h7v2H4zm13 0h3v2h-3zm0-10h3v2h-3zm0 5h3v2h-3z"></path></svg>
        </button>
      </div>
      <div class="playlist-panel" id="playlist-panel" aria-hidden="true">
        <div class="playlist-clip">
          <div class="playlist-box">
            <div class="playlist-head">
              <span class="playlist-title">Danh sách nhạc</span>
              <span class="playlist-count" id="playlist-count"></span>
            </div>
            <p class="playlist-note" id="playlist-note" hidden></p>
            <ul class="playlist-list" id="playlist-list" aria-label="Danh sách nhạc"></ul>
          </div>
        </div>
      </div>
      <audio id="audio-player" preload="metadata"></audio>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="profile-features.js?v=20260930b"></script>
  <script src="music.js?v=20260930b"></script>
</body>
</html>
