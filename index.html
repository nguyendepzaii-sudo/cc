<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>spekco | Profile</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

html {
    height: 100%;
}

/* =========================
   BODY & BACKGROUND FIX
========================= */

body {
    min-height: 100vh;
    width: 100%;
    overflow-x: hidden;
    color: white;
    background-color: #0f051d;
}

/* =========================
   MAIN
========================= */

.container {
    width: calc(100% - 24px);
    max-width: 390px;
    margin: 20px auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
}

/* =========================
   GLASS CARD
========================= */

.card {
    width: 100%;
    padding: 18px;
    border-radius: 22px;
    background: rgba(20, 10, 35, 0.48);
    border: 1px solid rgba(255,255,255,0.18);
    box-shadow:
        0 8px 35px rgba(0,0,0,0.35),
        inset 0 0 20px rgba(255,255,255,0.03);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
}

/* =========================
   PROFILE
========================= */

.profile-card {
    text-align: center;
    padding-top: 22px;
}

.speech-bubble {
    display: inline-block;
    max-width: 100%;
    padding: 8px 12px;
    margin-bottom: 15px;
    border-radius: 14px;
    background: rgba(255, 150, 210, 0.18);
    border: 1px solid rgba(255, 180, 220, 0.35);
    color: #ffe5f3;
    font-size: 12px;
}

/* =========================
   AVATAR
========================= */

.avatar-wrapper {
    width: 92px;
    height: 92px;
    margin: 0 auto 12px;
    padding: 3px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff9edc, #a66cff, #ff9edc);
    box-shadow: 0 0 25px rgba(220,100,255,0.65);
}

.avatar {
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid rgba(255,255,255,0.8);
}

/* =========================
   USERNAME
========================= */

.username {
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 1px;
}

/* =========================
   STATUS
========================= */

.status-badge {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 7px;
    margin-top: 6px;
    color: #9cff68;
    font-size: 13px;
    transition: color 0.3s ease;
}

.status-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #6cff3d;
    box-shadow: 0 0 10px #6cff3d;
    animation: pulse 1.5s infinite;
    transition: background 0.3s ease, box-shadow 0.3s ease;
}

/* Style khi Offline */
.status-badge.offline-text {
    color: #aaaaaa;
}

.status-dot.offline {
    background: #888888;
    box-shadow: none;
    animation: none;
}

@keyframes pulse {
    0% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.35); opacity: 0.6; }
    100% { transform: scale(1); opacity: 1; }
}

/* =========================
   STATUS CARD
========================= */

.status-card {
    text-align: center;
    color: #e9dff5;
    font-size: 14px;
    font-style: italic;
}

/* =========================
   MUSIC
========================= */

.music-card {
    text-align: center;
}

.music-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #ff9bd8;
    margin-bottom: 8px;
}

.clock {
    font-size: 25px;
    font-weight: bold;
    color: #ff8fd2;
    letter-spacing: 1px;
    margin-bottom: 8px;
}

.song-title {
    font-size: 14px;
    color: #ffffff;
    margin-bottom: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* =========================
   PROGRESS BAR
========================= */

.progress-container {
    width: 100%;
    margin-bottom: 5px;
}

#progress {
    width: 100%;
    height: 5px;
    appearance: none;
    -webkit-appearance: none;
    border-radius: 10px;
    background: rgba(255,255,255,0.2);
    outline: none;
}

#progress::-webkit-slider-thumb {
    appearance: none;
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #ff8fd2;
    box-shadow: 0 0 10px rgba(255,100,210,0.8);
}

.time-row {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: #cfc5da;
    margin-top: 5px;
}

/* =========================
   MUSIC BUTTONS
========================= */

.controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 18px;
    margin-top: 13px;
}

.music-button {
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    background: rgba(255,255,255,0.10);
    border: 1px solid rgba(255,255,255,0.15);
    font-size: 17px;
    cursor: pointer;
    transition: 0.2s;
}

.music-button:active {
    transform: scale(0.88);
    background: rgba(255,150,220,0.3);
}

.play-button {
    width: 56px;
    height: 56px;
    font-size: 21px;
    background: linear-gradient(135deg, rgba(255,120,200,0.65), rgba(150,100,255,0.65));
    box-shadow: 0 0 20px rgba(220,100,255,0.35);
}

/* =========================
   TECH STACK LOGOS
========================= */

.tech-title {
    text-align: center;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #ff9bd8;
    margin-bottom: 12px;
}

.tech-stack {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
}

.tech-icon {
    width: 46px;
    height: 46px;
    border-radius: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.12);
    transition: transform 0.2s ease, background 0.2s ease;
}

.tech-icon:hover {
    transform: translateY(-2px);
    background: rgba(255, 255, 255, 0.15);
}

.tech-icon svg {
    width: 28px;
    height: 28px;
    display: block;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 420px) {
    .container {
        width: calc(100% - 18px);
        margin: 12px auto;
    }

    .card {
        padding: 15px;
    }

    .clock {
        font-size: 22px;
    }
}

</style>
</head>


<body>

<script>

/* ==========================================
   TỰ ĐỘNG CẬP NHẬT TRẠNG THÁI ONLINE / OFFLINE
========================================== */

function updateOnlineStatus() {
    const statusDot = document.getElementById("status-dot");
    const statusText = document.getElementById("status-text");
    const statusBadge = document.getElementById("status-badge");

    if (navigator.onLine) {
        statusText.textContent = "online";
        statusDot.classList.remove("offline");
        statusBadge.classList.remove("offline-text");
    } else {
        statusText.textContent = "offline";
        statusDot.classList.add("offline");
        statusBadge.classList.add("offline-text");
    }
}

window.addEventListener("online", updateOnlineStatus);
window.addEventListener("offline", updateOnlineStatus);
updateOnlineStatus();

/* ==========================================
   CLOCK
========================================== */

function updateClock() {
    const now = new Date();
    let hours = now.getHours();
    const minutes = String(now.getMinutes()).padStart(2, "0");
    const seconds = String(now.getSeconds()).padStart(2, "0");
    const ampm = hours >= 12 ? "PM" : "AM";

    hours = hours % 12 || 12;
    hours = String(hours).padStart(2, "0");

    document.getElementById("clock").textContent = `${hours}:${minutes}:${seconds} ${ampm}`;
}

updateClock();
setInterval(updateClock, 1000);

/* ==========================================
   MUSIC PLAYER (HỖ TRỢ FILE .FLAC)
========================================== */

// Danh sách các file nhạc FLAC của bạn trên GitHub
const songs = [
    "Tien Tien - My Everything.flac",
    "bob$ - Ít Bạn Ít Nạn.flac"
];

let currentSong = 0;

const audio = document.getElementById("audio-player");
const playButton = document.getElementById("play-button");
const prevButton = document.getElementById("prev-button");
const nextButton = document.getElementById("next-button");
const songName = document.getElementById("song-name");
const progress = document.getElementById("progress");
const currentTimeText = document.getElementById("current-time");
const durationText = document.getElementById("duration");

function loadSong(index) {
    currentSong = index;
    const songFile = songs[currentSong];
    audio.src = songFile;

    // Tự động loại bỏ phần mở rộng dạng tập tin (.flac, .mp3, v.v.) để lấy tên bài hát sạch
    const displayName = songFile.split('/').pop().replace(/\.[^/.]+$/, "");
    songName.textContent = displayName;

    audio.load();
    progress.value = 0;
    currentTimeText.textContent = "0:00";
    durationText.textContent = "0:00";
}

function playSong() {
    audio.play().then(() => {
        playButton.textContent = "⏸";
    }).catch(error => {
        console.log("Không thể tự động phát nhạc do chính sách trình duyệt:", error);
    });
}

function pauseSong() {
    audio.pause();
    playButton.textContent = "▶";
}

playButton.addEventListener("click", function() {
    if (audio.paused) {
        playSong();
    } else {
        pauseSong();
    }
});

nextButton.addEventListener("click", function() {
    currentSong++;
    if (currentSong >= songs.length) {
        currentSong = 0;
    }
    loadSong(currentSong);
    playSong();
});

prevButton.addEventListener("click", function() {
    if (audio.currentTime > 3) {
        audio.currentTime = 0;
        return;
    }
    currentSong--;
    if (currentSong < 0) {
        currentSong = songs.length - 1;
    }
    loadSong(currentSong);
    playSong();
});

audio.addEventListener("ended", function() {
    currentSong++;
    if (currentSong >= songs.length) {
        currentSong = 0;
    }
    loadSong(currentSong);
    playSong();
});

audio.addEventListener("timeupdate", function() {
    if (!audio.duration) return;
    const percent = (audio.currentTime / audio.duration) * 100;
    progress.value = percent;
    currentTimeText.textContent = formatTime(audio.currentTime);
});

audio.addEventListener("loadedmetadata", function() {
    durationText.textContent = formatTime(audio.duration);
});

progress.addEventListener("input", function() {
    if (!audio.duration) return;
    audio.currentTime = (progress.value / 100) * audio.duration;
});

function formatTime(seconds) {
    if (!seconds || isNaN(seconds)) return "0:00";
    const minutes = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60).toString().padStart(2, "0");
    return `${minutes}:${secs}`;
}

// Tải bài hát đầu tiên khi mở trang
loadSong(0);

</script>
